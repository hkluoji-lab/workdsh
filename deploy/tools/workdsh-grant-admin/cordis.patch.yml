# 只在沙箱 profile 里引用；生产启用时再加入（面板「资源授权」页依赖它）。
- insert:
    - id: workdsh-grant-admin
      name: 'file:///data/dsh/tools/workdsh-grant-admin/dist/index.js'
      config:
        organizationId: local-personal
        siteOwnerPrincipalId: local-user
        storageRoot: /data/dsh/tmp/p1sandbox-home/storages
        rosterFile: /data/dsh/tmp/p1sandbox-home/principals.json
        secretFile: /data/dsh/tmp/p1sandbox-home/identity-bridge.key
        adminJobRoles: management,operations
