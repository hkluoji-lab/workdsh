# >>> P1 身份打通 + 资源授权 BEGIN (2026-09-27 启用) >>>
# 目的：把门户登录身份变成 DSH 内**每个账号各自的主体**，并使岗位角色真正决定能做什么。
# 组成（三块，缺一不可）：
#   workdsh-identity-portal  身份服务：按「会话绑定 → 请求作用域门户身份 → 兜底 local-user」解析主体
#   workdsh-grant-baseline   收敛循环：站点资源 × 活跃成员的基线授权（read/use），并按岗位补 manage、回收降级授权
#   workdsh-grant-admin      资源授权接口：面板「资源授权」页的后端（验签 + 以调用者身份提交）
# 为什么先写花名册再启用：把现有两个账号先放进花名册，迁移工具才能以所有者身份给它们签发授权；
#   否则一上线就会出现"门户账号不是活跃成员、拿不到任何资源"的窗口。
# 安全：身份头由门户用 /data/dsh/portal/identity-bridge.key 做 HMAC 签名，插件验签后才认。
# 回滚：注释掉本块（含 disabled 行）即可；老会话的归属绑定与花名册都不受影响。
# 备份：cordis.patch.yml.bak.p1enable.20260927231315
- insert:
    - id: workdsh-identity-portal
      name: 'file:///data/dsh/tools/workdsh-identity-portal/dist/index.js'
      config:
        organizationId: local-personal
        organizationName: 本地个人空间
        fallbackPrincipalId: local-user
        secretFile: /data/dsh/portal/identity-bridge.key
        rosterFile: /data/dsh/storages/workdsh_identity_portal/principals.json
        # fail-closed 闸门：收敛工具在"一轮授权完全成功"后写出该文件；
        # 文件不存在时本插件不认门户身份（全部退回兜底主体），
        # 因此绝不会出现"人人都是独立主体、却谁都没有权限"的锁定窗口。
        activationFile: /data/dsh/storages/workdsh_identity_portal/activated
- insert:
    - id: workdsh-grant-baseline
      name: 'file:///data/dsh/tools/workdsh-grant-baseline/dist/index.js'
      config:
        organizationId: local-personal
        siteOwnerPrincipalId: local-user
        storageRoot: /data/dsh/storages
        rosterFile: /data/dsh/storages/workdsh_identity_portal/principals.json
        activationFile: /data/dsh/storages/workdsh_identity_portal/activated
        baselineActions: read,use
        manageJobRoles: management,operations
        ensureIntervalMs: 30000
        changeDebounceMs: 2000
- insert:
    - id: workdsh-grant-admin
      name: 'file:///data/dsh/tools/workdsh-grant-admin/dist/index.js'
      config:
        organizationId: local-personal
        siteOwnerPrincipalId: local-user
        storageRoot: /data/dsh/storages
        rosterFile: /data/dsh/storages/workdsh_identity_portal/principals.json
        secretFile: /data/dsh/portal/identity-bridge.key
        adminJobRoles: management,operations

# <<< P1 身份打通 + 资源授权 END <<<
- id: prompt-enhance
  disabled: false
  config:
    maxOutputTokens: 8192
    timeoutMs: 120000

# 市场一键重启反向规避（2026-10-02）：本宿主统一由容器级脚本 dsh-restart-web.sh 重启，
# 不启用市场自带 self-restart（其 detached helper 会与 entrypoint 运行期看护争抢 3080 端口，
# 表现为「市场升级→重启→网站网关错误」）。效果：/dsh-market/restart 立即返回
# 403 {"error":"self-restart is disabled for this host"}（语义清晰，不再是 loopback 文案）。
# 回滚：删除本注释块与下面三行，重启容器即可。
- id: dsh-market
  config:
    allowRestart: false
- id: auto-continue
  name: dsh-client-auto-continue
  config:
    locale: zh
    paused: false

# AGENT_LOOP_CONCURRENCY_5 (2026-10-02): 对标官方 issue #699（8 子代理并发触发崩溃），
# 把 agent-loop 的并行工具/子代理池上限从默认 10 收紧到 5，降低 GC 压力触发面。
# 回滚：删除本块，
