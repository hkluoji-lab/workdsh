#   注意：原先包住本段的 BEGIN/END 哨兵已一并移除 —— 它当时把下面 permission 与
#   llm-deepseek 两条无关配置也圈在里面，按哨兵整块摘除会误删它们。
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
