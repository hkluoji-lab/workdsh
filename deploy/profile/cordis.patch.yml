# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).

# 2026-09-21（批次 A）：11 个第三方 bundle 已临时从 dsh.profile.bundles 摘除，
# 目的是让「宿主升 0.1.6-alpha.2 + WorkDSH 批次 A」成为唯一变量。tgz 与用户数据
# 全部保留在 /workspace/wd-upload 与各自 storage 内，逐个放回时同步恢复下列覆盖行：
#   dshmarket / dsh-context / @nanmicoder/dsh-agent-teams / dsh-cost-meter /
#   @liustack/modlens / dsh-univer-office / @vectorize-io/hindsight-coding-agents /
#   @anionex/dsh-vision-toolkit / @xmanrui/dsh-im
#   @furongjun1999-dsh-memory → 原 python 覆盖行
#   @awiki/dsh-plugin → 原 awiki / awiki-provider / awiki-summary-provider 三条禁用

# 关于 dshmarket（插件市场）：它由 <profile>/package.json 的 dsh.profile.bundles 注册；
# 该包的 package.json 声明了 dsh.bundle.patch = ./cordis.patch.yml，
# 插件自身那条 `- insert: [{id: dsh-market, name: dshmarket}]` 已在 bundle 层自动应用。
# ⚠️ 不要在这里重复 insert，否则 loader 会抛
#    "duplicate loader entry id: dsh-market" 导致 dsh 无法启动（2026-09-13 实际踩过）。
# 本文件留给市场写热禁用行（`- id: …` + `disabled: true|false`）使用。

# 2026-09-19：workdsh-bundle 的 cordis.patch.yml 会 insert 这两条 computer-use 条目，
# 它们依赖 @trycua/cua-driver-linux-x64-gnu 的原生库 libcua_driver_sdk.so，该库需要
# libX11.so.6，而本容器镜像没有这个共享库；加载失败会让整棵插件树启动失败（不是只影响
# 该插件）。原来是在 node_modules/workdsh-bundle/cordis.patch.yml 里手删这两条，但
# 每次 pnpm install 都会把这个文件恢复成 tarball 里的原件，改动会被静默抹掉；改到这里
# 才能跨重装保留。若镜像补上 libX11 后可把这两行去掉以恢复 computer-use。
- id: computer-use
  disabled: true
- id: computer-use-cua-driver-native
  disabled: true

# 2026-09-22 探针：官方 ui-plugin-manager 自持左侧「插件」导航行（order 0）。
# 插件管理能力在 设置 → 内置插件 / 插件管理 中已有官方入口，导航行按用户要求移除。
- id: ui-plugin-manager
  disabled: true

# 2026-09-23 定时任务 overlay（等价于官方 @deepseek-ai/dsh-experimental-schedule-bundle
# 的 cordis.patch.yml，三行同形）：
#   schedule     = 宿主服务：schedule_create/list/delete 工具 + schedule 会话投影
#   time-context = 按浏览器时区解释自然语言时间（官方 Web overlay 同款）
#   ui-schedule  = 官方客户端任务页面（左侧「自动化任务」导航行 + /schedules 面板 +
#                  会话内任务卡片与提醒目录），Web 组合默认不含，须显式 insert
# 2026-09-30 修复：原先只 insert 前两行，ui-schedule 写成上面的
#   `- id: ui-schedule / disabled: false`。该写法是悬空行：目标 id 不在组合树中
#   （没有任何 bundle 提供它），loader 只 warn，于是左侧「自动化任务」在升级到
#   0.2.0-rc.2 后消失。改为在 insert 中直接声明官方客户端包。
#   与 workdsh-plugin-schedule（id workdsh-automation、order 40）id 不同，互不遮蔽。
#
# 2026-10-11 修复（插件市场"点更新不能完工"的根因）：官方 @deepseek-ai/dsh-web-app
#   0.2.1-alpha.2 的 cordis.patch.yml 已自带 `- id: schedule`(L139) 与
#   `- id: ui-schedule`(L389) 两条 insert，本层再 insert 同名 id 就在组合树里
#   产生重复条目：
#     duplicate loader entry id "schedule" (2 rows)    layer: dsh-web-app / user-patch
#     duplicate loader entry id "ui-schedule" (2 rows) layer: dsh-web-app / user-patch
#   真实启动容忍这两条重复（2026-10-11 12:00 宿主即在同一份磁盘状态下启动成功），
#   但 dshmarket 的试启动校验（lib/trial.js 对 composed.duplicates 一律 push 成
#   error）把它判为致命，且更新流程只要 pnpm 安装成功就必跑该校验 —— 结果是
#   **任何插件**的更新都会在最后一步被回滚（市场日志 2026-10-11T11:53:23Z，
#   @goodandready/dsh-russian-lang@0.3.42 exit=0 仍被 rollback）。
#   因此这里只保留官方仍未自带的 time-context；schedule / ui-schedule 交给
#   dsh-web-app 自己的 insert 提供（左侧「自动化任务」入口不受影响）。
#   校验证据：node -e 'trialValidate("/data/dsh/profiles/web", readBundleStack(...).community)'
#   → 修复前 ok=false（2 条 duplicate），修复后 ok=true。
- insert:
    - id: time-context
      name: '@deepseek-ai/dsh-time-context'

