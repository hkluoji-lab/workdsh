# >>> workdsh-plugin-schedule BEGIN (managed by deploy/install.sh) >>>
# 2026-09-26 定时任务入口复修开放（D12 / P2-03）
# 背景：左侧「定时任务」此前是 workdsh-bundle 注册的「（待开放）」占位入口，
#   而官方宿主能力（@deepseek-ai/dsh-schedule + time-context）已在 profile 补丁层
#   启用 —— 缺的只是一个真正的管理入口。本插件补上这个入口，并如实标注官方的
#   交付边界。
# 2026-09-30 更正：官方客户端半侧（@deepseek-ai/dsh-client-ui-schedule）此前
#   **并未**在本补丁层启用（见文件上方 schedule overlay 块，当时只有一条悬空
#   `- id: ui-schedule / disabled: false`），故升级到 0.2.0-rc.2 后左侧
#   「自动化任务」（官方 id `schedules`）消失。该行已在 2026-09-30 修复为正式
#   insert；官方 id `schedules` 与本插件的 id `workdsh-automation` 不同，
#   两者并存、互不遮蔽，本插件的遮蔽逻辑仍只针对 workdsh-bundle 的旧占位。
# 遮蔽机制：客户端半侧用 priority -10 注册同名 sidebar.panellist(id) 与
#   main(key)，官方 SlotCore 对 list/keyed 槽按 (priority, order) 排序后按
#   id/key 去重、先到者胜，因此占位行与占位面板被替换；同 priority 才会抛
#   duplicate，故 -10 是必需的。workdsh-bundle 未被修改。
# 回滚：sudo ./install.sh --rollback（按哨兵精确摘除本块后重启容器）。
#   补丁层虽为 patchReload=live，但新增 file: 行需要重启才能进插件树。
- insert:
    - id: workdsh-schedule
      name: 'file:///data/dsh/tools/workdsh-plugin-schedule/dist/index.js'
