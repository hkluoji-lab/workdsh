<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070a10">
<title>注册 — WorkDSH 企业级 AI 智能体工作台</title>
<meta name="description" content="注册 WorkDSH 企业级 AI 智能体工作台账号。">
<meta name="robots" content="noindex">
<link rel="icon" href="/portal/assets/mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/portal/styles.css">
</head>
<body class="auth-body">

            <line x1="73.87" y1="79.36" x2="74.88" y2="83.13"/>
            <line x1="66" y1="80.4" x2="66" y2="84.3"/>
            <line x1="58.13" y1="79.36" x2="57.12" y2="83.13"/>
            <line x1="50.8" y1="76.33" x2="48.85" y2="79.7"/>
            <line x1="44.5" y1="71.5" x2="41.75" y2="74.25"/>
            <line x1="39.67" y1="65.2" x2="36.3" y2="67.15"/>
            <line x1="36.64" y1="57.87" x2="32.87" y2="58.88"/>
            <line x1="35.6" y1="50" x2="31.7" y2="50"/>
            <line x1="36.64" y1="42.13" x2="32.87" y2="41.12"/>
            <line x1="39.67" y1="34.8" x2="36.3" y2="32.85"/>
            <line x1="44.5" y1="28.5" x2="41.75" y2="25.75"/>
            <line x1="50.8" y1="23.67" x2="48.85" y2="20.3"/>
            <line x1="58.13" y1="20.64" x2="57.12" y2="16.87"/>

            <line x1="73.87" y1="20.64" x2="74.88" y2="16.87"/>

            <line x1="95.36" y1="42.13" x2="99.13" y2="41.12"/>
          </g>
          <ellipse cx="66" cy="50" rx="22" ry="17.5" fill="#FFFFFF"/>
          <circle cx="66" cy="50" r="15.5" fill="#2670DA"/>
          <circle cx="66" cy="50" r="6.5" fill="#0A1526"/>
          <circle cx="61" cy="44" r="3" fill="#FFFFFF"/>

          <rect x="187" y="73" width="48" height="12" fill="#2670DA"/>
        </svg>
      </a>
      <p class="eyebrow">企业级 AI 智能体工作台</p>
      <h1>注册账号，开始使用。</h1>
      <p class="lead">注册后即可登录工作台。Token 用量按账号独立计费，充值请前往计费平台完成。</p>
      <ul class="ticks ticks-labeled">
        <li><strong>独立账号</strong>每个账号独立的会话与用量，互不可见。</li>
        <li><strong>按量计费</strong>在计费平台自行充值，额度用完即停。</li>
        <li><strong>管理员可控</strong>账号角色与状态由管理员集中管理。</li>
      </ul>
      <p class="auth-foot">已有账号？<a href="/login">直接登录</a>。</p>
    </div>
  </section>

  <section class="auth-panel">
    <div class="auth-card">
      <h2>注册</h2>
      <p class="auth-sub">填写下方信息创建账号。</p>
      {{NOTICE}}
      {{ERROR}}
      <form class="auth-form" method="post" action="/api/portal/register" autocomplete="on">
        <input type="hidden" name="next" value="{{NEXT}}">
        <div class="field">
          <label for="username">用户名</label>
          <input id="username" name="username" type="text" autocomplete="username" required autofocus spellcheck="false">
        </div>
        <div class="field">
          <label for="password">密码</label>
          <div class="field-row">
            <input id="password" name="password" type="password" autocomplete="new-password" required>
            <button class="reveal" type="button" data-portal-reveal aria-label="显示密码" aria-pressed="false">显示</button>
          </div>
        </div>
        <div class="field">
          <label for="password2">确认密码</label>
          <input id="password2" name="password2" type="password" autocomplete="new-password" required>
        </div>
        {{INVITE}}
        <button class="button button-primary button-block" type="submit">创建账号</button>
      </form>
      <p class="auth-hint">{{POLICY}}</p>
      <p class="auth-back"><a href="/login">已有账号，返回登录</a></p>
    </div>
  </section>
</main>

<script src="/portal/portal.js" defer></script>
</body>
</html>
