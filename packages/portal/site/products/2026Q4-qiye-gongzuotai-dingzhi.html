<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>企业工作台定制解决方案 · 在线翻页电子书刊 | WorkDSH 企业级 AI 智能体工作台</title>
<meta name="description" content="企业工作台定制解决方案在线翻页电子书刊：产品功能简介、六大部门业务覆盖、应用场景、团队协同、私有化与联署定制、平台底座、真实界面、信任与安全、常见问题与合作方式。">
<meta name="theme-color" content="#0b4ea2">
<link rel="icon" href="/portal/assets/mark.svg" type="image/svg+xml">

<style>
:root{
  /* ---- 品牌 ---- */
  --brand:#0b4ea2;--brand-deep:#06306b;--brand-mid:#1868c0;
  --brand-soft:#eef4fc;--brand-tint:#f7fafd;--brand-line:#cfe0f2;--brand-line2:#e2ecf8;
  --accent:#e8722c;--accent-soft:#fdf1e7;--accent-line:#f2d3b8;
  /* ---- 文本 ---- */
  --ink:#0f1f36;--ink2:#3f5470;--ink3:#75879f;--ink4:#9aabc0;
  /* ---- 面/线 ---- */
  --line:#e6edf6;--line-soft:#f1f5fa;--paper:#ffffff;--bg:#eef2f8;
  --ok:#0a7d3c;--ok-soft:#e9f6ee;
  /* ---- 空间节奏（4 的倍数） ---- */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
  /* ---- 版心 ---- */
  --pad-x:40px;--pad-t:44px;--pad-b:34px;
  /* ---- 字阶 ---- */
  --fs-h1:1.72em;--lh-h1:1.24;
  --fs-h2:1.34em;--lh-h2:1.3;
  --fs-h3:1.06em;--lh-h3:1.42;
  --lh-body:1.78;
  /* ---- 动效 ---- */
  --ease-book:cubic-bezier(.3,.02,.18,1);--dur-turn:.82s;
  --font:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans CJK SC","Source Han Sans SC","WenQuanYi Micro Hei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --num:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --pw:400px;--ph:566px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);color:var(--ink);background:
    radial-gradient(1200px 600px at 50% -10%,#dde8f7 0%,transparent 62%),
    linear-gradient(180deg,#f3f7fc 0%,#e7eef7 100%);
  min-height:100vh;overflow-x:hidden;
  display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
/* ================= 顶栏 ================= */
.topbar{
  height:56px;flex:0 0 56px;display:flex;align-items:center;gap:12px;
  padding:0 14px;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);position:relative;z-index:60;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{
  width:30px;height:30px;border-radius:8px;background:linear-gradient(140deg,var(--brand),var(--brand-mid));
  display:grid;place-items:center;flex:0 0 auto;
}
.brand .mark svg{width:20px;height:20px;display:block}
.brand .tt{font-weight:700;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .tt small{display:block;font-weight:400;font-size:11px;color:var(--ink3);letter-spacing:.2px}
.spacer{flex:1}
.tools{display:flex;align-items:center;gap:6px}
.tb{
  border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:9px;
  height:34px;min-width:34px;padding:0 10px;font-size:13px;font-family:inherit;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.18s;
}
.tb:hover{border-color:var(--brand-line);color:var(--brand);background:var(--brand-soft)}
.tb:disabled{opacity:.4;cursor:default}
.tb:disabled:hover{border-color:var(--line);color:var(--ink2);background:#fff}
.tb .lbl{white-space:nowrap}
@media(max-width:880px){.tb .lbl{display:none}.brand .tt small{display:none}}
@media(max-width:520px){.brand .tt{font-size:13px}.tools{gap:4px}.tb{padding:0 8px}}
/* ================= 阅读区 ================= */
.reader{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:22px 16px;overflow:hidden;position:relative;
}
.stage{perspective:2600px;perspective-origin:50% 46%;position:relative}
.book{
  position:relative;width:calc(var(--pw) * 2);height:var(--ph);
  transform-style:preserve-3d;
  transition:transform var(--dur-turn) var(--ease-book);
}
.book.closed{transform:translateX(calc(var(--pw) / -2))}
.book.single{width:var(--pw)}
.book.single.closed{transform:none}
/* 书脊：多层渐变给出圆脊的受光与转折，翻开后渐显 */
.spine{
  position:absolute;left:50%;top:-2px;bottom:-2px;width:68px;transform:translateX(-50%);
  pointer-events:none;z-index:40;opacity:0;
  transition:opacity .5s ease;
  background:
    linear-gradient(90deg,
      rgba(12,30,58,0) 0%,
      rgba(12,30,58,.05) 26%,
      rgba(12,30,58,.15) 42%,
      rgba(12,30,58,.24) 50%,
      rgba(12,30,58,.15) 58%,
      rgba(12,30,58,.05) 74%,
      rgba(12,30,58,0) 100%);
}
.book.open .spine{opacity:1}
.book.single .spine{display:none}
/* 纸张：绕左边缘旋转；缓动用带轻微过冲的曲线，接近真实书页落下的手感 */
.sheet{
  position:absolute;top:0;left:50%;width:var(--pw);height:var(--ph);
  transform-origin:left center;transform-style:preserve-3d;
  transform:rotateY(0deg);
  transition:transform var(--dur-turn) var(--ease-book);
}
.book.single .sheet{left:0}
.sheet.flipped{transform:rotateY(-180deg)}
/* 拖拽跟手：关闭过渡 */
.book.dragging .sheet{transition:none}
.book.dragging .book,.book.dragging{transition:none}
.sheet .face{
  position:absolute;inset:0;overflow:hidden;background:var(--paper);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  box-shadow:0 12px 34px rgba(15,36,66,.15),0 2px 7px rgba(15,36,66,.08);
  border-radius:2px;
}
.sheet .face.back{transform:rotateY(180deg)}
/* 多张纸依次叠放时，下层纸的投影会透过上层纸显影，看起来像页边有多余的框。
   只保留当前可见的两张面有投影（.flat = 被盖住的面）。 */
.sheet .face.flat{box-shadow:none}
/* ---- 纸页弧度：随转动角度的受光带 + 页根阴影 ---- */
/* 高光带：贴在翻动面上，位置随旋转推进（由 turning 的 0→1 动画驱动） */
.sheet .face::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:5;
  opacity:0;background:
    linear-gradient(100deg,
      rgba(255,255,255,0) 34%,
      rgba(255,255,255,.5) 48%,
      rgba(255,255,255,.86) 52%,
      rgba(255,255,255,.4) 57%,
      rgba(255,255,255,0) 72%);
  transform:translateX(-26%);
}
/* 页根压暗：越靠近书脊越暗，模拟纸面弯折的受光衰减 */
.sheet .face::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:4;opacity:0;
  background:linear-gradient(90deg,rgba(8,20,40,.22) 0%,rgba(8,20,40,.06) 12%,rgba(255,255,255,0) 34%);
}
.sheet .face.back::before{background:linear-gradient(270deg,rgba(8,20,40,.22) 0%,rgba(8,20,40,.06) 12%,rgba(255,255,255,0) 34%)}
.sheet.turning .face::after{animation:curlGlint var(--dur-turn) var(--ease-book) both}
.sheet.turning .face::before{opacity:1;transition:opacity .18s}
@keyframes curlGlint{
  0%{opacity:.12;transform:translateX(-30%)}
  46%{opacity:.95;transform:translateX(14%)}
  100%{opacity:.10;transform:translateX(62%)}
}
/* 整张纸在翻转中段略微"鼓起"的投影（用外层阴影近似） */
.sheet.turning{filter:drop-shadow(0 26px 42px rgba(10,24,48,.22))}
/* 纸叠边缘：贴在最外侧的横向细纹，增加厚度感 */
.sheet .edge{
  position:absolute;top:0;right:0;width:12px;height:100%;pointer-events:none;opacity:.45;z-index:6;
  background:repeating-linear-gradient(180deg,#f9fbfe 0 2px,#e4ebf4 2px 3px);
}
/* 单页模式的纸张略厚 */
.book.single .sheet .face{box-shadow:0 16px 44px rgba(15,36,66,.22),0 3px 9px rgba(15,36,66,.10)}
.book.single .sheet .face.flat{box-shadow:none}
/* ---- 可翻页提示：右下折角 ---- */
.corner{
  position:absolute;right:0;bottom:0;width:86px;height:86px;z-index:7;
  pointer-events:none;opacity:0;transition:opacity .28s ease;
  background:linear-gradient(315deg,rgba(15,36,66,.10) 0%,rgba(15,36,66,.04) 34%,rgba(255,255,255,0) 52%);
}
/* 只在"当前可翻的那张纸"上显示折角：对开模式是 L 号纸，单页模式是 L 号纸 */
.book .sheet .corner{opacity:0}
.book.can-turn .sheet.now .face.front .corner{opacity:1}
@media(hover:hover){
  .book.can-turn .sheet.now:hover .face.front .corner{
    opacity:1;
    background:linear-gradient(315deg,rgba(15,36,66,.17) 0%,rgba(15,36,66,.06) 40%,rgba(255,255,255,0) 58%);
  }
}
/* 允许横向拖拽（纵向仍可滚动） */
.stage{touch-action:pan-y}
.book.locked .sheet{transition:none!important}
/* ================= 页 ================= */
.page{
  position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column;
  font-size:var(--pfs,13.5px);line-height:var(--lh-body);color:var(--ink2);
}
.page.blank{background:linear-gradient(180deg,#fbfcfe,#f4f7fb)}
/* 版心：内容不足时用 margin-bottom:auto 把富余空间全部沉到页脚之上，
   形成稳定的「上紧下松」页脚基线；只有真正溢出的页才走 scrollable 兜底。 */
.pbody{
  flex:1;min-height:0;padding:var(--pad-t) var(--pad-x) var(--pad-b);
  overflow:hidden;position:relative;
  display:flex;flex-direction:column;
}
.pbody>*{flex:0 0 auto}
.pbody>*:last-child{margin-bottom:auto}
/* 正文内嵌图（方案总览页的产品截图）：必须显式限宽 + height:auto。
   否则 img 的 height 属性会参与布局，1600px 视口下被拉成竖长条并撑出页面。 */
.pbody img{max-width:100%;height:auto;border-radius:6px;box-shadow:0 3px 14px rgba(15,36,66,.12);display:block;margin:0 auto;cursor:zoom-in}
.pbody.scrollable{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.pbody.scrollable>*:last-child{margin-bottom:var(--s5)}
.pbody.scrollable::-webkit-scrollbar{width:6px}
.pbody.scrollable::-webkit-scrollbar-thumb{background:var(--brand-line);border-radius:3px}
/* 内容仍超页时的兜底：明确提示本页可继续滚动，避免被固定页脚截断而看不出还有内容 */
.scrollhint{
  position:absolute;left:0;right:0;bottom:0;height:26px;display:none;
  align-items:flex-end;justify-content:center;pointer-events:none;
  font-size:10.5px;color:var(--brand);letter-spacing:.5px;
  background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.96) 62%);
}
.page.has-scroll .scrollhint{display:flex}
.pfoot{
  position:relative;flex:0 0 auto;height:38px;padding:0 var(--pad-x);gap:var(--s4);
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink4);
}
.pfoot::before{content:"";position:absolute;top:0;left:var(--pad-x);right:var(--pad-x);height:1px;background:var(--line)}
.pfoot>*{position:relative}
.pfoot .t{justify-self:start}
.pfoot .no{
  justify-self:center;font-family:var(--num);font-size:11px;font-weight:700;letter-spacing:.06em;
  color:var(--brand);font-variant-numeric:tabular-nums;text-transform:none;
}
/* 页边章：像纸书页眉，弱化但可辨 */
.pfoot .mk{justify-self:end;color:var(--brand-line);letter-spacing:0}
/* ================= 封面 ================= */
.cover{
  position:absolute;inset:0;display:flex;flex-direction:column;
  padding:var(--pad-t) var(--pad-x) var(--pad-b);color:#fff;overflow:hidden;
  background:
    radial-gradient(620px 420px at 84% 4%,rgba(232,114,44,.45) 0%,transparent 60%),
    radial-gradient(700px 520px at 0% 100%,rgba(24,104,192,.60) 0%,transparent 62%),
    linear-gradient(158deg,#062a5e 0%,#0b4ea2 48%,#083a7c 100%);
}
/* 极细网格 + 右上角方向的光：避免大面积纯色发闷，同时给出"工程感" */
.cover::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:
    linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px),
    linear-gradient(180deg,rgba(255,255,255,.06) 1px,transparent 1px);
  background-size:34px 34px;
  -webkit-mask-image:radial-gradient(125% 95% at 86% 4%,#000 0%,transparent 70%);
  mask-image:radial-gradient(125% 95% at 86% 4%,#000 0%,transparent 70%);
}
.cover>*{position:relative}
.cover .cv-top{
  display:flex;align-items:center;gap:9px;
  font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;opacity:.92;
}
.cover .cv-top .dot{width:7px;height:7px;background:var(--accent);border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 4px rgba(232,114,44,.22)}
.cover .cv-mid{margin:auto 0;padding:var(--s4) 0}
.cover .cv-eyebrow{
  font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(255,255,255,.64);margin-bottom:var(--s4);
  display:flex;align-items:center;gap:var(--s2);
}
.cover .cv-eyebrow::after{content:"";width:34px;height:1px;background:rgba(255,255,255,.38)}
.cover h1{
  font-size:2.62em;line-height:1.13;margin:0 0 var(--s4);font-weight:800;
  letter-spacing:.01em;text-shadow:0 2px 24px rgba(4,20,48,.3);
}
.cover .cv-sub{font-size:1.02em;line-height:1.78;color:rgba(255,255,255,.9);max-width:20em}
.cover .cv-tags{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s5)}
.cover .cv-tag{
  border:1px solid rgba(255,255,255,.38);border-radius:999px;padding:4px 12px;
  font-size:11.5px;letter-spacing:.04em;background:rgba(255,255,255,.10);
  backdrop-filter:blur(2px);
}
.cover .cv-foot{
  border-top:1px solid rgba(255,255,255,.28);padding-top:var(--s4);
  display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s4);
  font-size:11px;color:rgba(255,255,255,.84);letter-spacing:.04em;line-height:1.6;
}
.cover .cv-foot b{display:block;font-size:13px;font-weight:700;margin-bottom:4px;letter-spacing:.06em}
.cover .cv-badge{
  flex:0 0 auto;width:66px;height:66px;border-radius:16px;
  background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.34);
  display:grid;place-items:center;font-family:var(--num);
  font-size:18px;font-weight:800;letter-spacing:.06em;
}
/* ================= 章节页 ================= */
.sec{
  position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
  padding:var(--pad-t) var(--pad-x);color:#fff;overflow:hidden;
  background:linear-gradient(150deg,#083671 0%,#0b4ea2 56%,#1566b8 100%);
}
.sec::before{
  content:"";position:absolute;right:-90px;bottom:-120px;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle,rgba(232,114,44,.34) 0%,transparent 66%);pointer-events:none;
}
.sec>*{position:relative}
.sec .sec-no{
  font-family:var(--num);font-size:3.4em;font-weight:800;line-height:1;
  color:rgba(255,255,255,.24);letter-spacing:-.02em;
}
.sec h2{font-size:1.86em;line-height:1.28;margin:var(--s3) 0 var(--s4);font-weight:800;letter-spacing:.02em}
.sec .sec-lead{font-size:1em;line-height:1.8;color:rgba(255,255,255,.88);max-width:22em}
.sec .sec-rule{width:48px;height:3px;background:var(--accent);border-radius:2px;margin:var(--s5) 0 0}
.sec .sec-points{margin-top:var(--s5);display:flex;flex-direction:column;gap:var(--s2)}
.sec .sec-points span{font-size:.9em;color:rgba(255,255,255,.9);display:flex;gap:9px;align-items:flex-start;line-height:1.6}
.sec .sec-points span::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);flex:0 0 auto;margin-top:.6em}
/* ================= 正文排版 ================= */
/* 页首组：kicker + 标题 + 导语，与正文之间用固定节奏分隔 */
.pbody .kicker{
  display:inline-flex;align-items:center;gap:7px;align-self:flex-start;
  font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--brand);
  background:var(--brand-soft);border:1px solid var(--brand-line);border-radius:999px;
  padding:3px 11px 3px 9px;margin-bottom:var(--s4);
}
.pbody .kicker::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent)}
.pbody h3{
  font-size:var(--fs-h2);line-height:var(--lh-h2);margin:0 0 var(--s3);
  color:var(--ink);font-weight:800;letter-spacing:-.01em;
}
.pbody h3 .bar{display:none}
.pbody h3::after{
  content:"";display:block;width:38px;height:3px;border-radius:2px;
  background:linear-gradient(90deg,var(--accent),rgba(232,114,44,0));margin-top:var(--s3);
}
.pbody .lead{
  font-size:1.03em;line-height:1.72;color:var(--ink2);margin:0 0 var(--s5);
  max-width:30em;text-wrap:pretty;
}
/* 分节小标题：用于一页内两个主题的分隔 */
.pbody h4{
  font-size:var(--fs-h3);line-height:var(--lh-h3);font-weight:700;color:var(--brand-deep);
  margin:var(--s5) 0 var(--s3);letter-spacing:.01em;display:flex;align-items:center;gap:var(--s2);
}
.pbody h4::before{content:"";width:3px;height:1em;border-radius:2px;background:var(--brand);flex:0 0 auto}
.pbody>*:first-child{margin-top:0}
.pbody p{margin:0 0 var(--s3);max-width:30em}
.pbody p:last-child{margin-bottom:0}
.pbody ul,.pbody ol{margin:0 0 var(--s4);padding-left:1.1em;max-width:30em}
.pbody li{margin-bottom:var(--s2);padding-left:var(--s1)}
.pbody li::marker{color:var(--brand-line2);font-weight:700}
.pbody strong{color:var(--brand-deep);font-weight:700}
.pbody .muted{color:var(--ink3);font-size:.9em;line-height:1.66}
.pbody .card .cd,.pbody .mini .md,.pbody .io .txt{line-height:1.6}
/* 超窄屏兜底档（9.6–10.2px）收一档行高，换取更多整页放得下 */
.pbody[style*="9.6px"] .card .cd,.pbody[style*="10.2px"] .card .cd{line-height:1.48}
.pbody[style*="9.6px"] .step .sd,.pbody[style*="10.2px"] .step .sd{line-height:1.5}
.pbody[style*="9.6px"] .lead,.pbody[style*="10.2px"] .lead{line-height:1.62;margin-bottom:var(--s4)}

/* ================= 目录页 ================= */
.toc-wrap{display:flex;flex-direction:column;gap:var(--s5);margin-top:clamp(var(--s4),3.2vh,var(--s7))}
.toc-group{display:flex;flex-direction:column;gap:var(--s1)}
.toc-cap{
  font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink4);
  font-weight:700;display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s2);
}
.toc-cap::after{content:"";flex:1;height:1px;background:var(--line)}
/* 卷首：给一组轻底块，与正文章节形成"弱-强"对比 */
.toc-front{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s2)}
.toc-front .fi{
  display:flex;align-items:baseline;gap:var(--s2);padding:7px 10px;
  background:var(--brand-tint);border:1px solid var(--brand-line2);border-radius:8px;
  font-size:.92em;color:var(--ink2);
}
.toc-front .fi .fp{margin-left:auto;font-family:var(--num);font-size:.82em;color:var(--brand);font-weight:700}
/* 章节：章节号 + 标题 …… 页码（导点用 grid + 点线边界实现，比 flex 更稳） */
.toc-sec-list{display:flex;flex-direction:column}
.toc-sec{
  display:grid;grid-template-columns:34px 1fr auto;align-items:baseline;
  column-gap:var(--s2);padding:8px 0;border-bottom:1px solid var(--line-soft);
  text-decoration:none;color:inherit;cursor:pointer;
  background:none;border-left:0;border-right:0;border-top:0;font-family:inherit;width:100%;text-align:left;
}
.toc-sec:last-child{border-bottom:0}
.toc-sec .sn{
  font-family:var(--num);font-size:.86em;font-weight:700;color:var(--accent);
  letter-spacing:.04em;font-variant-numeric:tabular-nums;
}
.toc-sec .st{
  font-size:1.0em;font-weight:700;color:var(--ink);letter-spacing:.01em;
  display:flex;align-items:baseline;gap:var(--s2);min-width:0;
}
.toc-sec .st .dots{
  flex:1;min-width:12px;border-bottom:1px dotted var(--brand-line);transform:translateY(-.28em);
}
.toc-sec .sp{
  font-family:var(--num);font-size:.86em;font-weight:700;color:var(--brand);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.toc-sec:hover{background:var(--brand-tint)}
.toc-sec:hover .st{color:var(--brand)}
.toc-foot{
  display:flex;align-items:baseline;gap:var(--s2);padding-top:var(--s4);margin-top:var(--s1);
  border-top:1.5px solid var(--brand-line2);font-size:.95em;
}
.toc-foot .sn{font-family:var(--num);font-weight:700;color:var(--accent);font-size:.86em}
.toc-foot .st{font-weight:700;color:var(--ink)}
.toc-foot .sp{margin-left:auto;font-family:var(--num);font-weight:700;color:var(--brand);font-size:.86em}
.toc-note{font-size:.84em;color:var(--ink3);line-height:1.7;margin-top:var(--s4)}
/* 超窄屏（落入 9.6px 兜底档）时，目录条目最多，单独再收一档间距 */
.narrow .toc-wrap{gap:var(--s4);margin-top:var(--s3)}
.narrow .toc-sec{padding:6px 0}
.narrow .toc-front .fi{padding:5px 8px}
.narrow .toc-note{margin-top:var(--s3)}
/* 超窄屏兜底档（9.6px）下目录条目最多，整组再密排一次；
   实测 430×932 时目录组 451px、需 390px，故 gap 与行内边距都要收。 */
.pbody[style*="9.6px"] .toc-wrap{gap:7px;margin-top:2px}
.pbody[style*="9.6px"] .toc-group{gap:0}
.pbody[style*="9.6px"] .toc-sec{padding:2px 0}
.pbody[style*="9.6px"] .toc-cap{margin-bottom:3px;font-size:9px}
.pbody[style*="9.6px"] .toc-front{gap:3px}
.pbody[style*="9.6px"] .toc-front .fi{padding:3px 6px}
.pbody[style*="9.6px"] .toc-note{display:none}
.pbody[style*="9.6px"] .kicker{padding:2px 8px;margin-bottom:6px}
.pbody[style*="9.6px"] h3::after{margin-top:5px}
.pbody[style*="9.6px"] h3{margin-bottom:6px}
.toc-note kbd{
  font-family:var(--num);font-size:.92em;background:var(--brand-soft);color:var(--brand);
  border:1px solid var(--brand-line);border-radius:4px;padding:0 5px;
}

/* ================= 卡片 ================= */
.cards{display:flex;flex-direction:column;gap:var(--s3)}
.card{
  border:1px solid var(--line);border-radius:11px;padding:var(--s3) var(--s4);
  background:var(--paper);box-shadow:0 1px 2px rgba(15,36,66,.04);
}
.card .ct{
  font-weight:700;color:var(--ink);font-size:1.0em;margin-bottom:var(--s2);
  display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;line-height:1.45;
}
.card .ct .num{
  flex:0 0 auto;width:21px;height:21px;border-radius:7px;
  background:var(--brand-soft);color:var(--brand);border:1px solid var(--brand-line2);
  font-size:11px;display:grid;place-items:center;font-weight:800;font-family:var(--num);
}
.card .cd{color:var(--ink2);font-size:.94em;line-height:1.65}
.card.acc{border-left:3px solid var(--accent);background:var(--accent-soft);border-color:var(--accent-line)}
.card.tint{background:var(--brand-tint);border-color:var(--brand-line2)}
/* 网格 */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}
@media(max-width:520px){ .grid3{grid-template-columns:1fr} }
@media(min-width:521px) and (max-width:820px){ .grid3{grid-template-columns:1fr 1fr} }
/* 三栏等宽卡：文字长度需要接近，否则会出现一格两行、一格一行的锯齿 */
.grid3 .md{min-height:2.4em}
.mini{
  border:1px solid var(--line);border-radius:10px;padding:var(--s3);
  background:var(--paper);display:flex;flex-direction:column;gap:var(--s1);
}
.mini .mt{
  font-weight:700;color:var(--brand-deep);font-size:.96em;line-height:1.4;
  display:flex;align-items:baseline;gap:6px;
}
.mini .mt::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);flex:0 0 auto;transform:translateY(-2px)}
.mini .md{font-size:.86em;color:var(--ink2);line-height:1.62}
/* 清单：名称在左、说明在右，适合"短名 + 一行描述"的场景，避免窄列里断成两三个字一行 */
.deflist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.def{
  display:grid;grid-template-columns:118px 1fr;gap:var(--s4);align-items:baseline;
  padding:var(--s3) 0;border-bottom:1px solid var(--line-soft);
}
.def .dt{
  font-weight:700;color:var(--ink);font-size:.97em;line-height:1.5;
  display:flex;align-items:baseline;gap:var(--s2);
}
.def .dt::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);flex:0 0 auto;transform:translateY(-2px)}
.def .dd{font-size:.92em;color:var(--ink2);line-height:1.66}
.def:last-child{border-bottom:0}
@media(max-width:640px){ .def{grid-template-columns:1fr;gap:var(--s1)} }

/* ================= 输入 → 过程 → 交付物 ================= */
.io{display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s1)}
.io .row{display:grid;grid-template-columns:46px 1fr;gap:var(--s2);align-items:start}
.io .tag{
  text-align:center;font-size:10px;font-weight:700;letter-spacing:.08em;
  padding:3px 0;border-radius:6px;
  background:var(--brand-soft);color:var(--brand);border:1px solid var(--brand-line2);
}
.io .tag.proc{background:var(--line-soft);color:#4a6b93;border-color:var(--line)}
.io .tag.out{background:var(--accent-soft);color:#b8541a;border-color:var(--accent-line)}
.io .txt{font-size:.92em;color:var(--ink2);line-height:1.62;padding-top:1px}

/* ================= 步骤 ================= */
.steps{display:flex;flex-direction:column;margin-top:var(--s2)}
.step{display:grid;grid-template-columns:26px 1fr;gap:var(--s3);position:relative;padding-bottom:var(--s4)}
.step:last-child{padding-bottom:0}
.step .sn{
  width:26px;height:26px;border-radius:50%;background:var(--paper);color:var(--brand);
  border:1.5px solid var(--brand-line);font-size:11.5px;font-weight:800;font-family:var(--num);
  display:grid;place-items:center;z-index:1;
}
.step:not(:last-child)::before{
  content:"";position:absolute;left:12.5px;top:28px;bottom:2px;width:1px;
  background:linear-gradient(180deg,var(--brand-line),var(--brand-line2));
}
.step .st{font-weight:700;color:var(--ink);font-size:1.0em;line-height:1.45;margin-bottom:2px}
.step .sd{font-size:.92em;color:var(--ink2);line-height:1.64}

/* ================= 徽标 / 提示块 ================= */
.pill{
  display:inline-flex;align-items:center;gap:4px;
  font-size:10.5px;font-weight:700;letter-spacing:.02em;
  padding:2px 9px;border-radius:999px;white-space:nowrap;
  background:var(--ok-soft);color:var(--ok);
}
.pill::before{content:"";width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.7}
.pill.warn{background:var(--accent-soft);color:#b8541a}
.pill.info{background:var(--brand-soft);color:var(--brand)}
.callout{
  border-radius:11px;padding:var(--s3) var(--s4);
  background:var(--brand-tint);border:1px solid var(--brand-line2);
  font-size:.92em;color:var(--ink2);line-height:1.68;
}
.callout b,.callout strong{color:var(--brand-deep)}
.callout.acc{background:var(--accent-soft);border-color:var(--accent-line);color:#7a3c10}
.callout.acc b{color:#8f4514}
/* 要点清单 */
.keylist{margin:0;padding:0;list-style:none}
.keylist li{position:relative;padding-left:var(--s5);margin-bottom:var(--s3);font-size:.95em;color:var(--ink2);line-height:1.66}
.keylist li:last-child{margin-bottom:0}
.keylist li::before{
  content:"";position:absolute;left:2px;top:.52em;width:9px;height:9px;border-radius:2.5px;
  background:var(--brand-soft);border:1.5px solid var(--brand);
}
.keylist.warn li::before{background:var(--accent-soft);border-color:var(--accent)}

/* ================= 指标 ================= */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}
.kpi{
  border:1px solid var(--line);border-radius:11px;padding:var(--s3) var(--s2) var(--s3);
  text-align:center;background:var(--paper);
  display:flex;flex-direction:column;gap:2px;
}
.kpi .kv{font-size:1.62em;font-weight:800;color:var(--brand);line-height:1.05;font-family:var(--num);letter-spacing:-.02em}
.kpi .kl{font-size:10.5px;color:var(--ink3);line-height:1.4;letter-spacing:.02em}

/* ================= 表格 ================= */
table.tb2{width:100%;border-collapse:collapse;font-size:.9em}
table.tb2 th,table.tb2 td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top;line-height:1.6}
table.tb2 th{background:var(--brand-tint);color:var(--brand-deep);font-weight:700;white-space:nowrap}
table.tb2 tr:not(:last-child) td{border-bottom-color:var(--line-soft)}
table.tb2 td{color:var(--ink2)}
/* 要点清单 */
.keylist{margin:0;padding:0;list-style:none}
.keylist li{
  position:relative;padding-left:20px;margin-bottom:7px;font-size:.95em;color:var(--ink2);line-height:1.58;
}
.keylist li::before{
  content:"";position:absolute;left:2px;top:.55em;width:8px;height:8px;border-radius:2px;
  background:var(--brand-soft);border:1.5px solid var(--brand);
}
.keylist.warn li::before{background:#fdf3e7;border-color:var(--accent)}
/* ================= 图片页 ================= */
/* 页面比例 1:1.414 与截图 1.84:1 不同，按可用宽度等比展示，绝不裁切。 */
.imgpage{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper)}
.imgpage .ibar{
  flex:0 0 auto;padding:var(--pad-t) var(--pad-x) var(--s4);
  border-bottom:1px solid var(--line);
}
.imgpage .ibar b{
  display:flex;align-items:baseline;gap:var(--s2);
  font-size:var(--fs-h2);color:var(--ink);font-weight:800;line-height:var(--lh-h2);letter-spacing:-.01em;
}
.imgpage .ibar span{display:block;font-size:.92em;color:var(--ink2);line-height:1.66;margin-top:var(--s2);max-width:32em}
.imgpage .iimg{
  flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;
  gap:var(--s4);padding:var(--s5) var(--pad-x);min-height:0;overflow:hidden;
}
.imgpage .iimg .shot{width:100%;margin:0;text-align:center}
.imgpage .iimg .shot img{max-height:calc(var(--ph, 566px) - 250px)}
@media(max-width:640px){ .imgpage .iimg .shot img{max-height:calc(var(--ph, 566px) - 200px)} }
.imgpage .iimg img{
  display:block;width:100%;height:auto;object-fit:contain;
  border:1px solid var(--line);border-radius:8px;
  box-shadow:0 6px 24px rgba(15,36,66,.13),0 1px 3px rgba(15,36,66,.06);
  cursor:zoom-in;background:var(--paper);
}
.imgpage .iimg .shot figcaption{
  font-size:11px;color:var(--ink3);margin-top:var(--s3);line-height:1.55;text-align:center;
}
.imgpage .ifoot{
  flex:0 0 auto;padding:0 var(--pad-x) var(--s4);
  font-size:10px;color:var(--ink4);text-align:right;line-height:1.5;letter-spacing:.04em;
}
.imgpage .ifoot::before{content:"";display:block;height:1px;background:var(--line);margin-bottom:var(--s3)}
/* 落款页 */
.signature{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.sig-row{display:flex;gap:10px;align-items:baseline;font-size:.95em;color:var(--ink2)}
.sig-row .sk{flex:0 0 72px;color:var(--ink3);font-size:.88em}
.sig-row .sv{font-weight:600;color:var(--brand-deep)}
/* 合作意向表单（内联于手册页，提交门户同源的 /api/portal/orders） */
.f-form{display:flex;flex-direction:column;gap:6px}
.f-row{display:flex;flex-direction:column;gap:2px}
.f-row>span{font-size:.85em;color:var(--ink2);font-weight:600}
.f-row .req{color:#c0392b;font-style:normal;font-weight:400}
.f-row .opt{color:var(--ink3);font-style:normal;font-weight:400}
.f-row input[type=text],.f-row input[type=tel],.f-row textarea{
  width:100%;border:1px solid var(--line);border-radius:7px;padding:4px 8px;
  font-size:.9em;font-family:inherit;color:var(--ink);background:#fff;
}
.f-row input:focus,.f-row textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.f-row textarea{resize:none}
.f-chips{display:flex;flex-wrap:wrap;gap:5px}
.f-chips label{
  display:inline-flex;align-items:center;gap:4px;font-size:.84em;color:var(--ink2);
  border:1px solid var(--line);border-radius:999px;padding:2px 8px;cursor:pointer;background:#fff;
}
.f-chips label.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-deep);font-weight:600}
.f-chips input{margin:0;vertical-align:middle}
.f-submit{
  border:0;border-radius:8px;background:linear-gradient(140deg,var(--brand),var(--brand-mid));color:#fff;
  font-size:.94em;font-weight:700;padding:7px 12px;cursor:pointer;font-family:inherit;letter-spacing:.5px;
}
.f-submit:disabled{opacity:.6;cursor:default}
.f-msg{font-size:.84em;line-height:1.45;min-height:1.2em}
.f-msg.err{color:#c0392b}
.f-msg.ok{color:var(--ok)}
.f-hint{font-size:.78em;color:var(--ink3);line-height:1.45}
/* 联系方式块 */
.contact{
  border-radius:10px;padding:13px 15px;background:linear-gradient(140deg,#07306b,#0b4ea2);
  color:#fff;display:flex;align-items:center;gap:14px;
}
.contact .cl{flex:1}
.contact .cl b{display:block;font-size:1.5em;font-weight:800;letter-spacing:1px;font-variant-numeric:tabular-nums}
.contact .cl span{display:block;font-size:11px;color:rgba(255,255,255,.82);margin-top:2px}
.contact .cqr{flex:0 0 auto;width:74px;height:74px;background:#fff;border-radius:8px;padding:5px;display:grid;place-items:center}
.contact .cqr svg{width:100%;height:100%;display:block}
/* 目录抽屉 */
.mask{
  position:fixed;inset:0;background:rgba(10,22,40,.42);backdrop-filter:blur(2px);
  opacity:0;pointer-events:none;transition:.25s;z-index:80;
}
.mask.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;height:100%;width:min(430px,92vw);background:#fff;z-index:90;
  transform:translateX(105%);transition:transform .3s cubic-bezier(.4,.05,.2,1);
  display:flex;flex-direction:column;box-shadow:-14px 0 44px rgba(10,22,40,.22);
}
.drawer.on{transform:translateX(0)}
.drawer .dh{
  flex:0 0 auto;padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;
}
.drawer .dh b{font-size:15px;color:var(--brand-deep)}
.drawer .dh .dc{
  margin-left:auto;border:0;background:var(--line-soft);color:var(--ink2);width:30px;height:30px;
  border-radius:8px;cursor:pointer;font-size:15px;line-height:1;font-family:inherit;
}
.drawer .db{flex:1;overflow-y:auto;padding:15px 18px 24px}
.toc-l{margin:0;padding:0;list-style:none}
.toc-l li{margin-bottom:6px}
.toc-a{
  width:100%;display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:#fff;
  border-radius:9px;padding:8px 10px;cursor:pointer;font-family:inherit;text-align:left;transition:.16s;
}
.toc-a:hover{background:var(--brand-soft);border-color:var(--brand-line);transform:translateX(2px)}
.toc-a .n{font-size:11px;font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums;flex:0 0 auto}
.toc-a .t{flex:1;font-size:13px;color:var(--ink);line-height:1.4}
.toc-a .p{font-size:11px;color:var(--ink3);flex:0 0 auto;font-variant-numeric:tabular-nums}
.toc-sec .t{font-weight:700;color:var(--brand-deep)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:9px}
.th{
  border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px;cursor:pointer;
  font-family:inherit;text-align:left;transition:.16s;
}
.th:hover{border-color:var(--brand-line);background:var(--brand-soft)}
.th.cur{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 1px var(--brand) inset}
.th .tn{display:block;font-size:10.5px;color:var(--brand);font-weight:700;font-variant-numeric:tabular-nums}
.th .tt2{display:block;font-size:12px;color:var(--ink);margin-top:3px;line-height:1.4}
/* 灯箱 */
.lightbox{
  position:fixed;inset:0;background:rgba(6,14,26,.9);z-index:100;display:none;
  align-items:center;justify-content:center;padding:24px;cursor:zoom-out;
}
.lightbox.on{display:flex}
.lightbox img{max-width:100%;max-height:100%;box-shadow:0 20px 60px rgba(0,0,0,.5);border-radius:4px}
/* 底栏 */
.bottombar{
  flex:0 0 46px;height:46px;display:flex;align-items:center;gap:12px;padding:0 16px;
  background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  position:relative;z-index:55;
}
.progress{flex:1;height:5px;background:var(--line-soft);border-radius:4px;overflow:hidden;cursor:pointer;position:relative}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),#1780d0);border-radius:4px;transition:width .3s}
.pageno{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.pageno b{color:var(--brand);font-size:14px}
.hint{
  position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
  background:rgba(10,22,40,.82);color:#fff;font-size:12px;padding:7px 14px;border-radius:999px;
  white-space:nowrap;pointer-events:none;transition:opacity .6s;z-index:50;
}
@media(max-width:900px){.hint{display:none}}
/* 提示条 */
.toast{
  position:fixed;left:50%;bottom:70px;transform:translate(-50%,10px);background:rgba(10,22,40,.9);
  color:#fff;font-size:12.5px;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;
  transition:.25s;z-index:110;max-width:86vw;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* 移动端 */
@media(max-width:640px){
  .reader{padding:10px 8px}
  .pbody{padding:18px 18px 6px}
  .pfoot{padding:0 18px}
  .grid2,.grid3{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .cover{padding:26px 22px}
  .cover h1{font-size:2.05em}
  .sec{padding:28px 24px}
  .imgpage .ibar{padding:16px 18px 8px}
  .imgpage .iimg{padding:8px 12px}
  .imgpage .ifoot{padding:6px 18px 10px}
}
</style>

      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/></svg>

<main class="reader" id="reader">
  <div class="stage" id="stage">
    <div class="book closed" id="book"></div>
  </div>
  <div class="hint" id="hint">点击页面右侧翻页 ｜ ← → 键翻页 ｜ 滚轮 / 左右滑动也可以</div>

</aside>

<script>
/* ============================================================
   企业工作台定制解决方案 · 在线翻页电子书刊
   承载结构复用自 /portal/products/2026Q4-zhengqi-fuwu-shouce.html
   （#p=N 页码深链、双页对开 / 单页、翻开动画、目录与缩略图）
   本页为纯静态：全部页面内容内联，无后端接口依赖。
   ============================================================ */
var PAGES = [];
var N = 0;
var mode = 'spread';
var total = 0, L = 0, sheets = [], busy = false;
var book = null, stage = null, reader = null;

function esc(v){
  return String(v==null?'':v).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function pad2(n){ return String(n).padStart(2,'0'); }
function indexOfId(id){ for(var i=0;i<PAGES.length;i++){ if(PAGES[i].id===id) return i; } return -1; }

/* 界面截图使用同源既有的小尺寸 WebP 变体：原图是 ~3000px 宽的 PNG（0.4–0.8MB），
   而书页里最大只显示到 ~600px 宽，整张解码进 GPU 纹理是纯粹的浪费，
   反复 resize 时还会触发合成器重栅格化。变体在各资产之间命名并不统一
   （skills 只有 -680/-1360，其余是 -360/-720），因此逐项登记，避免静默 404。 */
/* 与 layout() 同一套尺寸公式，只为让 <img sizes> 贴近真实显示宽度：
   sizes 不准会选到分辨率不足的变体（曾出现 378px 原图撑 489px 槽位）。 */
function sizesForBook(){
  var vw = window.innerWidth, vh = window.innerHeight;
  var availH = vh - 56 - 46 - 44;
  var availW = vw - 32;
  var force = document.documentElement.dataset.forceMode;
  var spread = force ? (force === 'spread') : (vw >= 900);
  var pw;
  if(spread){
    var ph = Math.min(availH, 860);
    pw = Math.round(ph/1.414);
    if(pw*2 > availW) pw = Math.floor(availW/2);
  } else {
    pw = Math.min(availW, 560);
    var ph2 = Math.round(pw*1.414);
    if(ph2 > availH){ ph2 = availH; pw = Math.round(ph2/1.414); }
  }
  /* 按 2x 设备像素比上报：截图页最宽也就 ~600px，若只报 1x，
    高分屏（DPR 2）会选到分辨率不足的变体而发虚。 */
  var layout = (vw < 640) ? (pw - 36) : (pw - 44);
  return Math.round(layout * 2) + 'px';
}

/* 站点既有资产的多分辨率登记表。
   后台只保存基名（skills / ppt / library / team），由这里解析成真实的
   srcset 与尺寸 —— 变体命名在各资产之间并不统一（skills 只有 -680/-1360），
   所以逐项登记，避免静默 404 造成空图。 */
var ASSETS = {
  skills:  { variants:[['/portal/assets/skills-680.webp',680],['/portal/assets/skills-1360.webp',1360]], w:1360, h:739 },
  ppt:     { variants:[['/portal/assets/ppt-360.webp',360],['/portal/assets/ppt-720.webp',720]],          w:720,  h:393 },
  library: { variants:[['/portal/assets/library-360.webp',360],['/portal/assets/library-720.webp',720]],  w:720,  h:395 },
  team:    { variants:[['/portal/assets/team-360.webp',360],['/portal/assets/team-720.webp',720]],        w:720,  h:393 },
  dashboard:{ variants:[['/portal/assets/dashboard-1120.webp',1120]], w:1120, h:612 },
};

/* 把页面的 asset 描述解析成 { src, variants, w, h }：
   · 数据里给了完整对象（静态单文件）→ 直接用；
   · 数据里只有基名（后台驱动）→ 查登记表；
   · 都没有但给了 image 文件名 → 走媒体目录。 */
function resolveAsset(p){
  var a = p.asset;
  if(a && typeof a === 'object' && (a.src || (a.variants && a.variants.length))) return a;
  var key = typeof a === 'string' ? a : '';
  if(key && ASSETS[key]) return ASSETS[key];
  if(p.image){
    var url = (p.image.indexOf('/') === 0) ? p.image : (MEDIA_BASE + encodeURIComponent(p.image));
    return { src:url, variants:[[url,0]], w:p.imageW||720, h:p.imageH||393 };
  }
  return { src:'', variants:[], w:720, h:393 };
}

/* 眉标（kicker）由数据字段 theme 渲染，不再写进 body：
   后台编辑正文时不会误删眉标，眉标本身也可在后台单独改。 */
function kickerHTML(p){
  if(!p.theme) return '';
  var isCover = /^\s*<div class="cover"/.test(String(p.body||''));
  if(isCover) return '';
  return '<span class="kicker">'+esc(p.theme)+'</span>';
}
/* 页边章：取 theme 里的章节号；没有编号的页留空 */
function chapterMark(p){
  var m = String(p.theme||'').match(/^\s*(\d\d)/);
  return m ? m[1] : '';
}

function pageHTML(i){
  if(i>=PAGES.length) return '<div class="page blank"></div>';
  var p = PAGES[i];
  if(p.type==='img' || p.image){
    /* 整页配图：asset 可能是完整对象，也可能只是基名，统一由此解析 */
    var a = resolveAsset(p);
    var list = (a.variants && a.variants.length) ? a.variants : (a.src ? [[a.src, 0]] : []);
    var srcset = list.map(function(v){ return v[0] + (v[1] ? ' ' + v[1] + 'w' : ''); }).join(', ');
    var src = a.src || p.image || '';
    var figs = '<figure class="shot">'
      + '<img class="zoomable" loading="lazy" decoding="async" src="' + esc(src) + '"'
      + (srcset ? ' srcset="' + esc(srcset) + '"' : '')
      + ' sizes="' + sizesForBook() + '"'
      + ' width="' + (a.w||720) + '" height="' + (a.h||393) + '" alt="' + esc(p.alt||p.title) + '">'
      + (p.caption ? '<figcaption>'+esc(p.caption)+'</figcaption>' : '') + '</figure>';
    return '<div class="page"><div class="imgpage">'
      + '<div class="ibar"><b>'+esc(p.title)+'</b><span>'+esc(p.subtitle)+'</span></div>'
      + '<div class="iimg">'+figs+'</div>'
      + '<div class="ifoot">'+esc(p.foot||'')+'</div></div></div>';
  }
  var body = String(p.body||'');
  /* 封面/章节页整页自带背景，不套 pbody 与页脚 */
  if(p.type==='cover' || p.type==='sec' && /^\s*<div class="(cover|sec)"/.test(body)){
    return '<div class="page">'+body+'</div>';
  }
  var foot = '<div class="pfoot">'
    + '<span class="t">企业工作台定制解决方案</span>'
    + '<span class="no">'+pad2(i+1)+' / '+pad2(N)+'</span>'
    + '<span class="mk">'+(chapterMark(p) ? esc(chapterMark(p)) : '')+'</span></div>';
  return '<div class="page"><div class="pbody" data-pg="'+i+'">'
    + kickerHTML(p) + body + '</div>'
    + '<div class="scrollhint">↓ 本页内容较多，可继续向下滚动</div>'+foot+'</div>';
}

function build(){
  var prevPage = 0;
  if(total) prevPage = focusPage();
  book.innerHTML = '<div class="spine"></div>';
  book.classList.toggle('single', mode==='single');
  total = (mode==='single') ? N : Math.ceil(N/2);
  sheets = [];
  for(var k=0;k<total;k++){
    var el = document.createElement('div');
    el.className='sheet'; el.dataset.k=k;
    var front, back;
    if(mode==='single'){ front = pageHTML(k); back = '<div class="page blank"></div>'; }
    else { front = pageHTML(2*k); back = pageHTML(2*k+1); }
    el.innerHTML = '<div class="face front"><span class="edge"></span>'+front+'<span class="corner"></span></div>'
                 + '<div class="face back"><span class="edge"></span>'+back+'<span class="corner"></span></div>';
    book.appendChild(el);
    sheets.push(el);
  }
  L = leafForPage(prevPage);
  if(total) L = Math.max(0, Math.min(L, maxLeaf()));
  apply();
  initOrderForm();
  requestAnimationFrame(fitAll);
}

function focusPage(){ return (mode==='single') ? L : 2*L; }
function maxLeaf(){ return (mode==='single') ? total-1 : (N % 2 === 0 ? total : total-1); }
function leafForPage(i){
  if(mode==='single') return i;
  return (i % 2 === 0) ? i/2 : (i+1)/2;
}

function apply(){
  sheets.forEach(function(el){
    var k = +el.dataset.k;
    var flipped = k < L;
    el.classList.toggle('flipped', flipped);
    el.style.zIndex = flipped ? (k+1) : (total - k);
    el.style.transition = '';
    /* 只有当前可见的两张面保留投影，其余面去掉投影，避免叠影 */
    var front = el.querySelector('.face.front'), back = el.querySelector('.face.back');
    var topFlipped = flipped && (k === L-1);
    var topUnflipped = !flipped && (k === L);
    if(front) front.classList.toggle('flat', !topUnflipped);
    if(back) back.classList.toggle('flat', !topFlipped);
  });
  book.classList.toggle('closed', L===0);
  book.classList.toggle('open', L>0);
  markTurnable();
  updateChrome();
}

/* 标出"当前可翻的那张纸"（折角提示只出现在它上面），以及是否还有可翻空间 */
function markTurnable(){
  sheets.forEach(function(el, k){
    el.classList.toggle('now', k === L);
  });
  book.classList.toggle('can-turn', L < maxLeaf());
}

/* 深链：#p=N 表示第 N 页。用 replaceState 写地址栏（不产生历史记录），
   刷新、收藏、转发都能回到同一页；只认 #p=N，忽略无关 hash。 */
function pageFromHash(){
  var m = /(?:^|[#&])p=(\d+)/.exec(location.hash);
  if(!m) return 0;
  var n = parseInt(m[1], 10);
  return (isFinite(n) && n > 0) ? n : 0;
}
/* pageFromHash 返回 1-based 页码，此处不按 N 裁剪：启动早期 N 还是 0。 */
function pageIndexFromHash(){
  var n = pageFromHash();
  return n > 0 ? Math.max(0, Math.min(n-1, N-1)) : -1;
}
function syncHash(n){
  if(!history.replaceState) return;
  var want = '#p=' + n;
  if(location.hash !== want) history.replaceState(null, '', location.pathname + location.search + want);
}

function updateChrome(){
  var cur = Math.min(focusPage(), N-1);
  document.getElementById('curNo').textContent = cur+1;
  document.getElementById('totNo').textContent = N;
  var pct = N>1 ? (cur/(N-1))*100 : 100;
  document.getElementById('progressBar').style.width = pct.toFixed(1)+'%';
  document.getElementById('btnPrev').disabled = (L<=0);
  document.getElementById('btnNext').disabled = (L>=maxLeaf());
  document.getElementById('btnFirst').disabled = (L<=0);
  syncHash(cur+1);
}

function next(){
  if(busy || L>=maxLeaf()) return;
  var el = sheets[L];
  busy = true;
  el.style.zIndex = 999;
  el.classList.add('turning');
  requestAnimationFrame(function(){ el.classList.add('flipped'); });
  setTimeout(function(){
    L++;
    el.classList.remove('turning');
    busy = false;
    apply();
  }, 840);
}
function prev(){
  if(busy || L<=0) return;
  var el = sheets[L-1];
  busy = true;
  L--;
  el.style.zIndex = 999;
  el.classList.add('turning');
  apply();
  sheets.forEach(function(e){ if(+e.dataset.k===L) e.style.zIndex = 999; });
  setTimeout(function(){ el.classList.remove('turning'); busy=false; apply(); }, 840);
}
function goto(page){
  page = Math.max(0, Math.min(page, N-1));
  var target = Math.min(leafForPage(page), maxLeaf());
  closeDrawer();
  if(target===L) return;
  var steps = Math.abs(target-L);
  if(steps>3){ doJump(target); return; }
  (function step(){
    if(L===target) return;
    if(L<target){ next(); } else { prev(); }
    setTimeout(step, 900);
  })();
}
/* 直接跳页：淡出 → 立刻把每张纸翻到位 → 淡入。
   用 jumpToken 作废前一次尚未生效的跳转，否则连续跳页时两个 230ms 回调互相覆盖，
   L 会停在中途（例如点第 6 页却停在第 9 页）。 */
var jumpToken = 0, jumpTimer = null;
function doJump(target){
  var token = ++jumpToken;
  busy = true;
  book.style.transition = 'opacity .22s';
  book.style.opacity = '0.06';
  clearTimeout(jumpTimer);
  jumpTimer = setTimeout(function(){
    if(token !== jumpToken) return;
    L = Math.max(0, Math.min(target, maxLeaf()));
    sheets.forEach(function(el){
      var k = +el.dataset.k;
      el.style.transition = 'none';
      var flipped = k<L;
      el.classList.toggle('flipped', flipped);
      el.style.zIndex = flipped ? (k+1) : (total-k);
      var front = el.querySelector('.face.front'), back = el.querySelector('.face.back');
      if(front) front.classList.toggle('flat', !(!flipped && k===L));
      if(back) back.classList.toggle('flat', !(flipped && k===L-1));
      void el.offsetWidth;
      el.style.transition = '';
    });
    book.classList.toggle('closed', L===0);
    book.classList.toggle('open', L>0);
    book.style.opacity = '1';
    book.style.transition = '';
    busy = false;
    markTurnable();
    updateChrome();
  }, 200);
}

/* 自动缩排：内容超页时逐级缩小字号；缩到下限仍放不下才改为页内可滚动（兜底）。
   单页模式同样先缩字号：窄屏若只靠滚动兜底，固定页脚会压住被截断的正文，观感像坏页。
   字号下限两边都是 9.6px；对开（桌面）先用较大的中间档，单页（手机）依次下探以保证整页放得下（仍超页才页内滚动）。 */
function fitAll(){
  var narrow = document.documentElement.classList.contains('narrow');
  var sizes = narrow ? [13.5,13,12.5,12,11.4,10.8,10.2,9.6] : [13.5,12.8,12.1,11.4,10.8,10.2,9.6];
  document.querySelectorAll('.pbody').forEach(function(body){
    body.style.fontSize = sizes[0]+'px';
    body.classList.remove('scrollable');
    var i = 0;
    while(body.scrollHeight > body.clientHeight + 2 && i < sizes.length-1){
      i++;
      body.style.fontSize = sizes[i]+'px';
    }
    var scroll = body.scrollHeight > body.clientHeight + 2;
    body.classList.toggle('scrollable', scroll);
    var pg = body.closest('.page');
    if(pg) pg.classList.toggle('has-scroll', scroll);
  });
}

/* 单页模式：不加 .narrow 的滚动兜底（改为逐级缩小字号），但标记 narrow 供样式区分 */
function layout(){
  var vw = window.innerWidth, vh = window.innerHeight;
  var availH = vh - 56 - 46 - 44;
  var availW = vw - 32;
  var pw, ph, want = (vw >= 900) ? 'spread' : 'single';
  if(document.documentElement.dataset.forceMode) want = document.documentElement.dataset.forceMode;
  if(want==='spread'){
    ph = Math.min(availH, 860);
    pw = Math.round(ph/1.414);
    if(pw*2 > availW){ pw = Math.floor(availW/2); ph = Math.round(pw*1.414); }
  } else {
    pw = Math.min(availW, 560);
    ph = Math.round(pw*1.414);
    if(ph > availH){ ph = availH; pw = Math.round(ph/1.414); }
  }
  pw = Math.max(pw, 200); ph = Math.max(ph, 280);
  var changed = (want !== mode);
  /* 切换单页/双页时，L 的含义会从「对开索引」变成「页码索引」（或相反）。
     先按旧模式换算出「当前正在看的页」，build() 再用新模式换算回 L，
     否则跨断点重排会把读者丢到别的页（实测第 21 页→第 11 页），地址栏页码也被改写。 */
  var curPageNow = total ? Math.min(focusPage(), N-1) : 0;
  mode = want;
  document.documentElement.classList.toggle('narrow', mode==='single');
  document.documentElement.style.setProperty('--pw', pw+'px');
  document.documentElement.style.setProperty('--ph', ph+'px');
  var lbl = document.getElementById('btnMode').querySelector('.lbl');
  if(lbl) lbl.textContent = (mode==='spread' ? '双页' : '单页');
  if(changed || !sheets.length){
    total = (mode==='single') ? N : Math.ceil(N/2);
    L = Math.max(0, Math.min(leafForPage(curPageNow), maxLeaf()));
    build();
  } else {
    requestAnimationFrame(fitAll);
  }
}

/* ---------- 抽屉 / 灯箱 ---------- */
var mask, drawer, drawerBody, drawerTitle;
function pageName(p){ return esc(p.title || p.label || ''); }
function openDrawer(kind){
  if(kind==='toc'){
    /* 全书逐页目录：内容页取标题，图片页取界面名称，均可直接跳转 */
    drawerTitle.textContent = '目录（共 '+N+' 页）';
    drawerBody.innerHTML = '<ul class="toc-l">'+PAGES.map(function(p,i){
      var isSec = (p.type==='cover');
      var cls = isSec ? ' toc-sec' : '';
      return '<li><button class="toc-a'+cls+'" data-goto="'+esc(p.id)+'">'
        + '<span class="n">'+pad2(i+1)+'</span><span class="t">'+pageName(p)+'</span>'
        + '<span class="p">P'+(i+1)+'</span></button></li>';
    }).join('')+'</ul>';
  } else {
    drawerTitle.textContent = '缩略图（共 '+N+' 页）';
    drawerBody.innerHTML = '<div class="thumbs">'+PAGES.map(function(p,i){
      var cur = (Math.min(focusPage(),N-1)===i) ? ' cur' : '';
      return '<button class="th'+cur+'" data-jump="'+i+'"><span class="tn">第 '+(i+1)+' 页</span>'
        + '<span class="tt2">'+(p.title || p.label || '')+'</span></button>';
    }).join('')+'</div>';
  }
  drawer.classList.add('on'); mask.classList.add('on');
}
function closeDrawer(){ if(drawer) drawer.classList.remove('on'); if(mask) mask.classList.remove('on'); }

function onReady(){
  book = document.getElementById('book');
  stage = document.getElementById('stage');
  reader = document.getElementById('reader');
  mask = document.getElementById('mask');
  drawer = document.getElementById('drawer');
  drawerBody = document.getElementById('drawerBody');
  drawerTitle = document.getElementById('drawerTitle');

  document.addEventListener('click', function(e){
    var chip = e.target.closest('.f-chips input[type=checkbox]');
    if(chip){ var lab = chip.closest('label'); if(lab) lab.classList.toggle('on', chip.checked); return; }
    var g = e.target.closest('[data-goto]');
    if(g){ var gi = indexOfId(g.dataset.goto); if(gi>=0) goto(gi); return; }
    var j = e.target.closest('[data-jump]');
    if(j){ goto(+j.dataset.jump); return; }
    var z = e.target.closest('.zoomable');
    if(z){ document.getElementById('lightboxImg').src = z.src; document.getElementById('lightbox').classList.add('on'); }
  });
  mask.addEventListener('click', closeDrawer);
  document.getElementById('drawerClose').addEventListener('click', closeDrawer);
  document.getElementById('lightbox').addEventListener('click', function(){ this.classList.remove('on'); });

  document.getElementById('btnToc').addEventListener('click', function(){ openDrawer('toc'); });
  document.getElementById('btnThumb').addEventListener('click', function(){ openDrawer('thumb'); });
  document.getElementById('btnPrev').addEventListener('click', prev);
  document.getElementById('btnNext').addEventListener('click', next);
  document.getElementById('btnFirst').addEventListener('click', function(){ doJump(0); });
  document.getElementById('btnMode').addEventListener('click', function(){
    document.documentElement.dataset.forceMode = (mode==='spread') ? 'single' : 'spread';
    layout();
  });
  document.getElementById('btnFull').addEventListener('click', function(){
    if(document.fullscreenElement){ document.exitFullscreen(); }
    else if(document.documentElement.requestFullscreen){ document.documentElement.requestFullscreen(); }
  });
  document.getElementById('btnShare').addEventListener('click', share);
  document.getElementById('progress').addEventListener('click', function(e){
    var r = this.getBoundingClientRect();
    var r2 = Math.max(0, Math.min(1, (e.clientX - r.left)/r.width));
    goto(Math.round(r2*(N-1)));
  });

  document.addEventListener('keydown', function(e){
    /* 焦点在表单控件里时，方向键/空格属于控件本身，不翻页 */
    var t = e.target;
    if(t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable)) return;
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){ next(); e.preventDefault(); }
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){ prev(); e.preventDefault(); }
    else if(e.key==='Home'){ doJump(0); }
    else if(e.key==='End'){ doJump(N-1); }
    else if(e.key==='Escape'){ closeDrawer(); document.getElementById('lightbox').classList.remove('on'); }
  });
  /* 表单里的滚轮/触摸交给控件本身，避免页内滚动或翻页把表单抢走 */
  reader.addEventListener('wheel', function(e){
    var t = e.target;
    if(t && t.closest && t.closest('.f-form')){ e.stopPropagation(); }
  }, {passive:true, capture:true});
  initDrag();
  function userScrollableBody(el){
    if(!el || !el.classList || !el.classList.contains('pbody')) return null;
    var oy = getComputedStyle(el).overflowY;
    if(oy !== 'auto' && oy !== 'scroll') return null;
    return (el.scrollHeight > el.clientHeight + 2) ? el : null;
  }
  var wheelLock = 0;
  reader.addEventListener('wheel', function(e){
    var sb = userScrollableBody(e.target && e.target.closest ? e.target.closest('.pbody') : null);
    if(sb){
      var atTop = sb.scrollTop <= 0;
      var atBottom = sb.scrollTop + sb.clientHeight >= sb.scrollHeight - 2;
      if((e.deltaY > 0 && !atBottom) || (e.deltaY < 0 && !atTop)) return;
    }
    if(Math.abs(e.deltaY) < 22) return;
    var now = Date.now();
    if(now - wheelLock < 850) return;
    wheelLock = now;
    e.deltaY > 0 ? next() : prev();
  }, {passive:true});
  reader.addEventListener('click', function(e){
    if(e.target.closest('button')||e.target.closest('a')||e.target.closest('.zoomable')||e.target.closest('.toc-a')||e.target.closest('.f-form')||e.target.closest('.f-chips')) return;
    if(userScrollableBody(e.target.closest ? e.target.closest('.pbody') : null)) return;
    var r = book.getBoundingClientRect();
    var mid = r.left + r.width/2;
    (e.clientX > mid) ? next() : prev();
  });

  var rt;
  window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(layout, 200); });
  window.addEventListener('hashchange', function(){
    var i = pageIndexFromHash();
    if(i < 0) return;
    if(i !== Math.min(focusPage(), N-1)) doJump(leafForPage(i));
  });
}

/* 合作意向表单：复用门户同源接口 /api/portal/orders，与门户首页共用同一套服务端校验、
   10 分钟去重与按 IP 限流。客户端只做预校验与三态呈现，服务端返回内容一律走 textContent。 */
var TEL_RE = /^[0-9+\-()\s]{6,40}$/;
function initOrderForm(){
  var form = document.getElementById('orderForm');
  if(!form || form.dataset.bound) return;
  form.dataset.bound = '1';
  var msg = document.getElementById('orderMsg');
  var btn = document.getElementById('orderSubmit');
  var label = btn ? btn.textContent : '';
  var say = function(text, kind){
    if(!msg) return;
    msg.className = 'f-msg' + (kind ? ' ' + kind : '');
    msg.textContent = text;
  };
  form.addEventListener('submit', async function(e){
    e.preventDefault();
    var el = form.elements;
    var org = (el.org.value||'').trim();
    var contact = (el.contact.value||'').trim();
    var tel = (el.tel.value||'').trim();
    var note = (el.note.value||'').trim();
    var domains = Array.prototype.slice.call(form.querySelectorAll('input[name=domains]:checked')).map(function(i){ return i.value; });
    var missing = [];
    if(!org) missing.push('单位名称');
    if(!contact) missing.push('联系人');
    if(!tel) missing.push('联系电话');
    if(!domains.length) missing.push('想优先解决的场景');
    if(missing.length){ say('请先填写：' + missing.join('、'), 'err'); return; }
    if(!TEL_RE.test(tel)){ say('联系电话格式不正确：请填 6–40 位数字，可含 + - ( ) 与空格。', 'err'); return; }
    if(btn){ btn.disabled = true; btn.textContent = '提交中…'; }
    try{
      var res = await fetch('/api/portal/orders', {
        method:'POST', credentials:'same-origin',
        headers:{ 'Content-Type':'application/json', 'Accept':'application/json' },
        body: JSON.stringify({ org:org, contact:contact, tel:tel, note:note, domains:domains, intent:'consult' })
      });
      var payload = null;
      try{ payload = await res.json(); }catch(e2){ payload = null; }
      if(res.ok && payload && payload.ok){
        form.reset();
        form.querySelectorAll('.f-chips label.on').forEach(function(l){ l.classList.remove('on'); });
        say('✓ 已收到您的合作意向（受理编号 ' + String(payload.id).slice(0,8) + '）。客户经理会尽快与您联系。', 'ok');
      } else if(res.status === 422 && payload && Array.isArray(payload.errors) && payload.errors.length){
        /* 服务端校验未通过：原文照显，仅把服务端口径的「意向档位」换成页面上实际的字段名 */
        say(payload.errors.map(function(t){ return String(t).replace('意向档位', '想优先解决的场景'); }).join('；'), 'err');
      } else if(res.status === 429){
        say('提交过于频繁，请稍后再试，或直接致电 199 2529 9929。', 'err');
      } else {
        say('提交失败（HTTP ' + res.status + '），请稍后重试或致电 199 2529 9929。', 'err');
      }
    }catch(e3){
      say('网络异常，提交失败。可致电 199 2529 9929，或稍后重试。', 'err');
    }finally{
      if(btn){ btn.disabled = false; btn.textContent = label; }
    }
  });
}

/* ============================================================
   拖拽翻页：指针按住右半页向左拖 → 跟手旋转，松手按位移/速度决定「完成」或「回弹」。
   左侧向右拖则把刚翻过去的那张纸拉回来。触摸与鼠标共用 Pointer 事件。
   ============================================================ */
var drag = null;
function initDrag(){
  var DRAG_MIN = 6;          /* 超过这个位移才算拖拽，避免与点击冲突 */
  var COMMIT_RATIO = 0.28;   /* 拖过 28% 页宽即完成翻页 */

  function pctToDeg(p){ return -180 * Math.max(0, Math.min(1, p)); }

  function begin(e){
    if(busy || !book) return;
    var r = book.getBoundingClientRect();
    if(e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) return;
    var half = r.width / 2;
    var side = (e.clientX < r.left + half) ? 'left' : 'right';
    var usable = (side === 'right') ? (L < maxLeaf()) : (L > 0);
    if(!usable) return;
    drag = { id:e.pointerId, x0:e.clientX, y0:e.clientY, side:side, active:false, t0:Date.now(), lastX:e.clientX, lastT:Date.now(), v:0 };
  }

  function move(e){
    if(!drag || e.pointerId !== drag.id) return;
    var dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if(!drag.active){
      if(Math.abs(dx) < DRAG_MIN && Math.abs(dy) < DRAG_MIN) return;
      /* 纵向意图优先：交给页面滚动/翻页手势，不抢 */
      if(Math.abs(dy) > Math.abs(dx)){ drag = null; return; }
      drag.active = true;
      book.classList.add('dragging');
      if(drag.side === 'left') L = L - 1;      /* 把上一张纸拉回来 */
    }
    var now = Date.now();
    if(now - drag.lastT > 0){
      drag.v = (e.clientX - drag.lastX) / (now - drag.lastT);
      drag.lastX = e.clientX; drag.lastT = now;
    }
    var pw = book.getBoundingClientRect().width / (mode === 'single' ? 1 : 2);
    var p = (drag.side === 'right') ? (-dx / pw) : (1 - dx / pw);
    drag.p = Math.max(0, Math.min(1, p));
    var el = sheets[drag.side === 'right' ? L : L];
    if(el){
      el.style.zIndex = 999;
      el.style.transform = 'rotateY(' + pctToDeg(drag.p) + 'deg)';
      el.classList.toggle('turning', drag.p > 0.02);
    }
  }

  function finish(e){
    if(!drag || (e && e.pointerId !== drag.id)) return;
    var d = drag; drag = null;
    book.classList.remove('dragging');
    if(!d.active) return;
    lastDragEndAt = Date.now();   /* 让随后的 click 不再触发一次翻页 */
    var pw = book.getBoundingClientRect().width / (mode === 'single' ? 1 : 2);
    var flung = (d.side === 'right') ? (d.v < -0.6) : (d.v > 0.6);
    var go = (d.p >= COMMIT_RATIO) || flung;
    var el = sheets[L];
    if(d.side === 'left') L = L + 1;          /* 先复位，再决定是否真的翻 */
    if(el){ el.style.transform = ''; el.classList.remove('turning'); }
    if(go){
      if(d.side === 'right'){
        L = Math.min(L, maxLeaf());
        var cur = sheets[L];
        if(cur){ cur.classList.add('turning'); cur.classList.add('flipped'); }
        apply();
        setTimeout(function(){ if(cur) cur.classList.remove('turning'); }, 820);
      } else {
        prev();
      }
    } else {
      apply();
    }
  }

  var stageEl = document.getElementById('stage') || reader;
  stageEl.addEventListener('pointerdown', begin);
  window.addEventListener('pointermove', move, {passive:true});
  window.addEventListener('pointerup', finish);
  window.addEventListener('pointercancel', finish);
  /* 拖拽刚结束时抑制一次点击翻页，避免「拖完又跳一页」 */
  stageEl.addEventListener('click', function(e){
    if(Date.now() - lastDragEndAt < 320){ e.stopPropagation(); e.preventDefault(); }
  }, true);
}
var lastDragEndAt = 0;

function share(){
  var url = location.origin + location.pathname + '#p=' + (Math.min(focusPage(), N-1) + 1);
  var done = function(){ toast('本页链接已复制，对方打开即到第 ' + (Math.min(focusPage(), N-1) + 1) + ' 页'); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(done, function(){ legacyCopy(url, done); });
  } else { legacyCopy(url, done); }
}
function legacyCopy(t, cb){
  var ta = document.createElement('textarea');
  ta.value = t; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); cb(); }catch(e){ toast('请手动复制：'+t); }
  document.body.removeChild(ta);
}
var toastT;
function toast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(function(){ el.classList.remove('on'); }, 2200);
}
</script>
