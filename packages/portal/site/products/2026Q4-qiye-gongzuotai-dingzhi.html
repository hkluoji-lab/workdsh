iv class=\"toc-sec\"><span class=\"sn\">01</span><span class=\"st\">业务覆盖<i class=\"dots\"></i></span><span class=\"sp\">P6–P7</span></div><div class=\"toc-sec\"><span class=\"sn\">02</span><span class=\"st\">应用场景<i class=\"dots\"></i></span><span class=\"sp\">P8–P11</span></div><div class=\"toc-sec\"><span class=\"sn\">03</span><span class=\"st\">团队协同<i class=\"dots\"></i></span><span class=\"sp\">P12</span></div><div class=\"toc-sec\"><span class=\"sn\">04</span><span class=\"st\">私有化与联署定制<i class=\"dots\"></i></span><span class=\"sp\">P13–P16</span></div><div class=\"toc-sec\"><span class=\"sn\">05</span><span class=\"st\">平台底座<i class=\"dots\"></i></span><span class=\"sp\">P17–P18</span></div><div class=\"toc-sec\"><span class=\"sn\">06</span><span class=\"st\">真实界面<i class=\"dots\"></i></span><span class=\"sp\">P19–P22</span></div><div class=\"toc-sec\"><span class=\"sn\">07</span><span class=\"st\">信任与安全<i class=\"dots\"></i></span><span class=\"sp\">P23–P24</span></div><div class=\"toc-sec\"><span class=\"sn\">08</span><span class=\"st\">常见问题<i class=\"dots\"></i></span><span class=\"sp\">P25–P26</span></div><div class=\"toc-sec\"><span class=\"sn\">09</span><span class=\"st\">合作与签约<i class=\"dots\"></i></span><span class=\"sp\">P27–P29</span></div></div></div><div class=\"toc-foot\"><span class=\"sn\">10</span><span class=\"st\">封底</span><span class=\"dots\" style=\"flex:1;border-bottom:1px dotted var(--brand-line);transform:translateY(-.28em)\"></span><span class=\"sp\">P30</span></div><p class=\"toc-note\">顶部「目录 / 缩略图」可直达任意页；地址栏 <kbd>#p=N</kbd> 记录当前页码，刷新、收藏与转发都会回到同一页。滚轮、<kbd>←</kbd> <kbd>→</kbd> 或直接拖动页角都能翻页。</p></div>"},{"type":"content","id":"overview","title":"方案总览","label":"方案总览","theme":"方案总览 · 全书结构","body":"<h3>六个部门，六种用法</h3><p class=\"lead\">系统按公司现有部门口径定义岗位与能力边界：每个部门登录后看到的任务面、资料面与管理面，对应各自的职责。</p><div class=\"kpis\"><div class=\"kpi\"><div class=\"kv\">6</div><div class=\"kl\">部门覆盖</div></div><div class=\"kpi\"><div class=\"kv\">3</div><div class=\"kl\">交付形态</div></div><div class=\"kpi\"><div class=\"kv\">6</div><div class=\"kl\">定制流程步骤</div></div></div><div class=\"deflist\"><div class=\"def\"><div class=\"dt\">业务覆盖</div><div class=\"dd\">运营 / 管理 / 生产 / 服务 / 销售 / 市场推广与应用，六个部门六种用法。</div></div><div class=\"def\"><div class=\"dt\">应用场景</div><div class=\"dd\">智能体专家、企业技能资产、连接器、企业资料库、办公文档产出、项目与自动化。</div></div><div class=\"def\"><div class=\"dt\">私有化与联署定制</div><div class=\"dd\">公网 SaaS、企业私有化部署、混合部署三种交付形态。</div></div><div class=\"def\"><div class=\"dt\">信任与安全</div><div class=\"dd\">权限与审计、运行隔离、数据边界、版本与发布。</div></div></div>"},{"type":"content","id":"hero","title":"产品真实界面","label":"产品真实界面","body":"<h3>在对话中完成任务，成果落盘为真实文件</h3><p class=\"lead\">以下是产品的真实界面截图，非设计稿。用于判断它是否符合你的场景。</p><div style=\"text-align:center\"><img class=\"zoomable\" loading=\"eager\" fetchpriority=\"high\" decoding=\"async\" width=\"1120\" height=\"612\" src=\"/portal/assets/dashboard-1120.webp\" alt=\"WorkDSH 工作台界面：在对话中制作 HTML，右侧预览成果并交付真实文件。\" style=\"max-width:100%;border:1px solid var(--line);border-radius:6px;box-shadow:0 3px 14px rgba(15,36,66,.12);cursor:zoom-in\"></div><p class=\"muted\" style=\"text-align:center;margin-top:8px\">点击图片可放大查看</p>"},{"type":"content","id":"dept-intro","title":"业务覆盖 · 说明","label":"业务覆盖 · 说明","theme":"01 · 业务覆盖","body":"<h3>边界先定义，能力再落地</h3><p class=\"lead\">系统按公司现有部门口径定义岗位与能力边界：每个部门登录后看到的任务面、资料面与管理面，对应各自的职责。</p><ul class=\"keylist\"><li><b>任务面</b>——本部门能发起、承接与交付哪些任务。</li><li><b>资料面</b>——本部门可查阅、可维护的资料范围。</li><li><b>管理面</b>——本部门可配置的对象、权限与台账视图。</li></ul><div class=\"callout\" style=\"margin-top:10px\">部门岗位与能力边界已定义，逐域的强制生效随身份打通同步覆盖；企业 SSO、组织与跨组织隔离正在推进，本页不作交付承诺。</div><p style=\"margin-top:10px\"><span class=\"pill info\">运营</span> <span class=\"pill info\">管理</span> <span class=\"pill info\">生产</span> <span class=\"pill info\">服务</span> <span class=\"pill info\">销售</span> <span class=\"pill info\">市场推广与应用</span></p>"},{"type":"content","id":"dept-cards","title":"业务覆盖 · 六部门","label":"业务覆盖 · 六部门","theme":"01 · 业务覆盖","body":"<h3>六个部门，六种用法</h3><div class=\"cards\" style=\"margin-top:4px\"><div class=\"card\"><div class=\"ct\"><span class=\"num\">1</span>运营</div><div class=\"cd\">内容资产的编写与发布、项目与任务编排、账号与用量查看。</div></div><div class=\"card\"><div class=\"ct\"><span class=\"num\">2</span>管理</div><div class=\"cd\">全站能力，含平台配置、用户与权限、审计与登录台账。</div></div><div class=\"card\"><div class=\"ct\"><span class=\"num\">3</span>生产</div><div class=\"cd\">承接项目交付、维护资料库与文档、跑定时任务。</div></div><div class=\"card\"><div class=\"ct\"><span class=\"num\">4</span>服务</div><div class=\"cd\">查阅知识库与客户资料、使用专家答疑，以只读为主。</div></div><div class=\"card\"><div class=\"ct\"><span class=\"num\">5</span>销售</div><div class=\"cd\">使用专家与资料库服务客户，维护自己的项目与文档。</div></div><div class=\"card\"><div class=\"ct\"><span class=\"num\">6</span>市场推广与应用</div><div class=\"cd\">维护对外素材与产品页、查看资料库，并进入产品页后台。</div></div></div>"},{"type":"content","id":"scn-intro","title":"应用场景 · 说明","label":"应用场景 · 说明","theme":"02 · 应用场景","body":"<h3>按业务场景落地，而不是按功能清单</h3><p class=\"lead\">下面每一项都写成「输入 → 过程 → 交付物」，便于评估它是否解决你部门的问题。</p><div class=\"deflist\"><div class=\"def\"><div class=\"dt\">智能体专家</div><div class=\"dd\">岗位角色、专业判断与交付职责，写成可发布的专家定义，并配备真实技能与工具。</div></div><div class=\"def\"><div class=\"dt\">企业技能资产</div><div class=\"dd\">既有的工作方法与技能包，版本化、可导入导出，在团队内继续打磨。</div></div><div class=\"def\"><div class=\"dt\">连接器</div><div class=\"dd\">OA、CRM、数据库与内网 API，以 MCP 接入；连接定义、实例与凭据分离。</div></div><div class=\"def\"><div class=\"dt\">企业资料库</div><div class=\"dd\">按目录归集的资料与原件，可搜索正文、可预览，选中即带着上下文开启任务。</div></div><div class=\"def\"><div class=\"dt\">办公文档产出</div><div class=\"dd\">对话里的要求与素材，直接变成可交付的 Word、PowerPoint、Excel、HTML 与 PDF 文件。</div></div><div class=\"def\"><div class=\"dt\">项目与自动化</div><div class=\"dd\">计划、待办、任务、资产与成员在项目空间交接；周期性工作由定时任务触发。</div></div></div><div class=\"callout\" style=\"margin-top:var(--s5)\">每一项能力都标注了当前版本状态：「已在本版本运行」或「在扩展中」，不作无条件承诺。</div>"},{"type":"content","id":"scn-1","title":"智能体专家 / 企业技能资产","label":"智能体专家 / 企业技能资产","theme":"02 · 应用场景","body":"<div class=\"cards\"><div class=\"card\"><div class=\"ct\">智能体专家 <span class=\"pill warn\">SOP 协作在扩展中</span></div><div class=\"io\"><div class=\"row\"><span class=\"tag\">输入</span><span class=\"txt\">岗位角色、专业判断与交付职责</span></div><div class=\"row\"><span class=\"tag proc\">过程</span><span class=\"txt\">写成可发布的专家定义，配备真实技能与工具</span></div><div class=\"row\"><span class=\"tag out\">交付物</span><span class=\"txt\">专家定义与任务交接记录</span></div></div><div class=\"cd muted\" style=\"margin-top:6px\">多专家 SOP 协作在扩展中。</div></div><div class=\"card\"><div class=\"ct\">企业技能资产 <span class=\"pill\">已在本版本运行</span></div><div class=\"io\"><div class=\"row\"><span class=\"tag\">输入</span><span class=\"txt\">既有的工作方法与技能包</span></div><div class=\"row\"><span class=\"tag proc\">过程</span><span class=\"txt\">版本化、导入导出，在团队内继续打磨</span></div><div class=\"row\"><span class=\"tag out\">交付物</span><span class=\"txt\">技能包与修订记录</span></div></div><div class=\"cd muted\" style=\"margin-top:6px\">已在本版本运行。</div></div></div>"},{"type":"content","id":"scn-2","title":"连接器 / 企业资料库","label":"连接器 / 企业资料库","theme":"02 · 应用场景","body":"<div class=\"cards\"><div class=\"card\"><div class=\"ct\">连接器 <span class=\"pill warn\">OAuth 与多账号在扩展中</span></div><div class=\"io\"><div class=\"row\"><span class=\"tag\">输入</span><span class=\"txt\">OA、CRM、数据库与内网 API</span></div><div class=\"row\"><span class=\"tag proc\">过程</span><span class=\"txt\">以 MCP 接入；连接定义、实例与凭据分离，按对话显式选择实例</span></div><div class=\"row\"><span class=\"tag out\">交付物</span><span class=\"txt\">可复用的内部系统接入</span></div></div><div class=\"cd muted\" style=\"margin-top:6px\">交互式 OAuth 与多账号在扩展中。</div></div><div class=\"card\"><div class=\"ct\">企业资料库 <span class=\"pill\">成果回到资料库</span></div><div class=\"io\"><div class=\"row\"><span class=\"tag\">输入</span><span class=\"txt\">按目录归集的资料与原件</span></div><div class=\"row\"><span class=\"tag proc\">过程</span><span class=\"txt\">搜索正文、预览原件；选中资料带着上下文开启任务</span></div><div class=\"row\"><span class=\"tag out\">交付物</span><span class=\"txt\">可检索、可预览的资料集合</span></div></div><div class=\"cd muted\" style=\"margin-top:6px\">成果继续回到资料库。</div></div></div>"},{"type":"content","id":"scn-3","title":"办公文档产出 / 项目与自动化","label":"办公文档产出 / 项目与自动化","theme":"02 · 应用场景","body":"<div class=\"cards\"><div class=\"card\"><div class=\"ct\">办公文档产出 <span class=\"pill warn\">保真度仍在推进</span></div><div class=\"io\"><div class=\"row\"><span class=\"tag\">输入</span><span class=\"txt\">对话里的要求与素材</span></div><div class=\"row\"><span class=\"tag proc\">过程</span><span class=\"txt\">在对话中制作与编辑，边聊边改</span></div><div class=\"row\"><span class=\"tag out\">交付物</span><span class=\"txt\">Word、PowerPoint、Excel、HTML 与 PDF 真实文件</span></div></div><div class=\"cd muted\" style=\"margin-top:6px\">各格式保真度与跨平台验收仍在推进。</div></div><div class=\"card\"><div class=\"ct\">项目与自动化 <span class=\"pill info\">定时任务只负责触发</span></div><div class=\"io\"><div class=\"row\"><span class=\"tag\">输入</span><span class=\"txt\">计划、待办、任务、资产与成员</span></div><div class=\"row\"><span class=\"tag proc\">过程</span><span class=\"txt\">项目空间承载交接；周期性工作由定时任务触发</span></div><div class=\"row\"><span class=\"tag out\">交付物</span><span class=\"txt\">项目空间与任务记录</span></div></div><div class=\"cd muted\" style=\"margin-top:6px\">定时任务只负责触发，不复制业务规则。</div></div></div>"},{"type":"content","id":"collab","title":"团队协同","label":"团队协同","theme":"03 · 团队协同","body":"<h3>任务在部门之间交接，不靠转发聊天记录。</h3><p class=\"lead\">同一套任务、资料与专家在部门间流转：承接方看到的是完整上下文与历史修订，而不是一段需要重新解释的对话。</p><div class=\"steps\"><div class=\"step\"><span class=\"sn\">1</span><div class=\"sb\"><div class=\"st\">派发</div><div class=\"sd\">任务绑定专家与资料，明确交付要求与参与角色。</div></div></div><div class=\"step\"><span class=\"sn\">2</span><div class=\"sb\"><div class=\"st\">协作</div><div class=\"sd\">项目空间承载计划、待办、任务与资产，成员在同一处交接。</div></div></div><div class=\"step\"><span class=\"sn\">3</span><div class=\"sb\"><div class=\"st\">产出</div><div class=\"sd\">Word、PowerPoint、Excel、网页等产出落盘为真实文件，原件可在会话内预览。</div></div></div><div class=\"step\"><span class=\"sn\">4</span><div class=\"sb\"><div class=\"st\">复用与留痕</div><div class=\"sd\">成果回到资料库，专家与技能按修订演进，过程与结果留痕可审计。</div></div></div></div><div class=\"callout\" style=\"margin-top:10px\">专家与团队：团队定位、成员分工与任务入口。</div>"},{"type":"content","id":"onprem-intro","title":"私有化与联署定制 · 说明","label":"私有化与联署定制 · 说明","theme":"04 · 私有化与联署定制","body":"<h3>把智能体放进你的内网，<br>按你的业务长出来</h3><p class=\"lead\">我们提供三种交付形态，并在方案阶段逐项写清数据流向、账号接入方式与验收口径。</p><div class=\"callout acc\"><b>数据与凭据边界</b><br>连接定义、连接实例与账号凭据三者分离；实例由使用者显式选择，不做跨账号回退。凭据不进入对话内容、前端页面、导出包与运行日志。</div><div class=\"callout\" style=\"margin-top:10px\">私有化部署把应用与数据放在企业内网；<b>是否出网取决于所选模型与连接器</b>，我们在方案中逐项列出，不作无条件承诺。</div><p class=\"muted\" style=\"margin-top:9px\">业务操作按权限检查并留下审计记录；组织与跨组织隔离随企业版推进。</p>"},{"type":"content","id":"onprem-forms","title":"三种交付形态","label":"三种交付形态","theme":"04 · 私有化与联署定制","body":"<h3>三种交付形态</h3><div class=\"cards\" style=\"margin-top:4px\"><div class=\"card\"><div class=\"ct\"><span class=\"num\">A</span>公网 SaaS</div><div class=\"cd\">快速验证。使用托管实例评估能力与流程，适合先做概念验证再决定部署形态。</div></div><div class=\"card tint\"><div class=\"ct\"><span class=\"num\">B</span>企业私有化部署</div><div class=\"cd\">应用与数据部署在企业自己的服务器或私有云，由企业掌握运行与账号体系。</div></div><div class=\"card\"><div class=\"ct\"><span class=\"num\">C</span>混合部署</div><div class=\"cd\">控制面在外、数据面在内的组合形态，按业务敏感度逐层划分边界。</div></div></div><div class=\"callout\" style=\"margin-top:10px\">三种形态的能力范围与边界以方案阶段逐项确认为准；本页只列形态定义，不构成交付承诺。</div>"},{"type":"content","id":"onprem-steps","title":"六步定制流程","label":"六步定制流程","theme":"04 · 私有化与联署定制","body":"<h3>六步定制流程</h3><div class=\"steps\" style=\"margin-top:6px\"><div class=\"step\"><span class=\"sn\">1</span><div class=\"sb\"><div class=\"st\">需求澄清</div><div class=\"sd\">业务场景、参与角色、数据边界与验收口径。</div></div></div><div class=\"step\"><span class=\"sn\">2</span><div class=\"sb\"><div class=\"st\">POC 验证</div><div class=\"sd\">在隔离环境用真实数据跑通一条端到端链路。</div></div></div><div class=\"step\"><span class=\"sn\">3</span><div class=\"sb\"><div class=\"st\">定制开发</div><div class=\"sd\">按需开发技能、专家、连接器与业务页面。</div></div></div><div class=\"step\"><span class=\"sn\">4</span><div class=\"sb\"><div class=\"st\">联调验收</div><div class=\"sd\">联接内部系统，按验收清单逐项确认。</div></div></div><div class=\"step\"><span class=\"sn\">5</span><div class=\"sb\"><div class=\"st\">上线与培训</div><div class=\"sd\">私有化部署、权限与审计配置、管理员与使用者培训。</div></div></div><div class=\"step\"><span class=\"sn\">6</span><div class=\"sb\"><div class=\"st\">持续迭代</div><div class=\"sd\">技能与专家按修订演进，新版本不覆盖历史记录。</div></div></div></div>"},{"type":"content","id":"deliverables","title":"联署定制的交付物清单","label":"联署定制的交付物清单","theme":"04 · 私有化与联署定制","body":"<h3>联署定制的交付物清单</h3><ul class=\"keylist\" style=\"margin-top:8px\"><li>私有化部署包、部署说明与回滚方式</li><li>定制技能包与专家定义（含版本与修订记录）</li><li>连接器定义与企业侧账号接入说明</li><li>权限、审计与运行隔离配置</li><li>使用手册与管理员培训</li></ul><div class=\"callout acc\" style=\"margin-top:12px\">清单在方案阶段逐项确认；每一项都在验收清单里对应可核对的交付物与验收口径。</div><div class=\"contact\" style=\"margin-top:12px\"><div class=\"cl\"><b>谈谈你的部署形态</b><span>告诉我们场景、角色与数据边界，我们给出部署形态建议与 POC 方案。</span></div></div>"},{"type":"content","id":"base-intro","title":"平台底座 · 说明","label":"平台底座 · 说明","theme":"05 · 平台底座","body":"<h3>不是一个套壳对话框</h3><p class=\"lead\">WorkDSH 站在 DeepSeek Harness 之上构建：执行循环、技能解析、插件装配、运行隔离与模型接入都由该底座提供，WorkDSH 负责企业业务对象、授权、修订与交付。</p><div class=\"callout\">底座能力与企业业务能力分层：底座不重复造 Agent 循环，WorkDSH 不接管底座已有的执行、隔离与模型接入。</div><p style=\"margin-top:10px\"><span class=\"pill info\">官方执行循环</span> <span class=\"pill info\">原生插件机制</span> <span class=\"pill info\">运行隔离与审批</span> <span class=\"pill info\">模型可替换</span></p>"},{"type":"content","id":"base-detail","title":"底座要点","label":"底座要点","theme":"05 · 平台底座","body":"<div class=\"cards\"><div class=\"card\"><div class=\"ct\"><span class=\"num\">1</span>官方执行循环与技能解析</div><div class=\"cd\">任务拆解、工具调用、长任务执行与上下文处理由 Harness 提供；不在外层再造第二套 Agent 循环。</div></div><div class=\"card\"><div class=\"ct\"><span class=\"num\">2</span>原生插件机制</div><div class=\"cd\">专家、技能、连接器、资料库与办公能力都是可安装、可卸载的功能插件，通过公开契约与会话投影组合。</div></div><div class=\"card\"><div class=\"ct\"><span class=\"num\">3</span>运行隔离与审批</div><div class=\"cd\">命令执行与文件写入走官方沙箱与审批管线；插件的可见范围不等于权限，实际操作仍需服务端检查。</div></div><div class=\"card\"><div class=\"ct\"><span class=\"num\">4</span>模型可替换</div><div class=\"cd\">模型经官方适配器接入，凭据由企业侧提供，与业务数据和对话内容分离管理。</div></div><div class=\"card\"><div class=\"ct\"><span class=\"num\">5</span>真实文件产出</div><div class=\"cd\">产物是可直接交付的文件，不是聊天记录里的代码块；原件可在会话内预览。</div></div></div><p class=\"muted\" style=\"margin-top:9px\">企业 SSO、组织与跨组织隔离、用量与统计正在推进，本页不作交付承诺。</p>"},{"type":"img","id":"ui-skills","title":"06 · 真实界面 · 技能资产","label":"06 · 真实界面 · 技能资产","subtitle":"浏览、导入与管理技能，让工作方法可以被保存、修改和复用。","image":"/portal/assets/skills.png","asset":{"src":"/portal/assets/skills-680.webp","variants":[["/portal/assets/skills-680.webp",680],["/portal/assets/skills-1360.webp",1360]],"w":1360,"h":739},"alt":"WorkDSH 技能管理界面：浏览、导入和管理技能。","foot":"产品真实界面 · 技能资产"},{"type":"img","id":"ui-ppt","title":"06 · 真实界面 · 办公文档产出","label":"06 · 真实界面 · 办公文档产出","subtitle":"对话与演示文稿并排，制作、查看与编辑在同一个工作空间完成。","image":"/portal/assets/ppt.png","asset":{"src":"/portal/assets/ppt-720.webp","variants":[["/portal/assets/ppt-360.webp",360],["/portal/assets/ppt-720.webp",720]],"w":720,"h":393},"alt":"WorkDSH 演示文稿制作界面：对话与演示文稿并排。","foot":"产品真实界面 · 办公文档产出"},{"type":"img","id":"ui-library","title":"06 · 真实界面 · 企业资料库","label":"06 · 真实界面 · 企业资料库","subtitle":"按目录归集资料、搜索正文并预览原件，选中即可带着上下文继续工作。","image":"/portal/assets/library.png","asset":{"src":"/portal/assets/library-720.webp","variants":[["/portal/assets/library-360.webp",360],["/portal/assets/library-720.webp",720]],"w":720,"h":395},"alt":"WorkDSH 资料库界面：按目录管理资料并预览原件。","foot":"产品真实界面 · 企业资料库"},{"type":"img","id":"ui-team","title":"06 · 真实界面 · 专家与团队","label":"06 · 真实界面 · 专家与团队","subtitle":"查看团队定位、成员分工和任务入口，按部门职责划分使用范围。","image":"/portal/assets/team.png","asset":{"src":"/portal/assets/team-720.webp","variants":[["/portal/assets/team-360.webp",360],["/portal/assets/team-720.webp",720]],"w":720,"h":393},"alt":"WorkDSH 专家团队界面：查看团队定位、成员分工与任务入口。","foot":"产品真实界面 · 专家与团队"},{"type":"content","id":"trust-1","title":"信任与安全 · 边界","label":"信任与安全 · 边界","theme":"07 · 信任与安全","body":"<h3>把边界说清楚</h3><p class=\"lead\">安全与合规的每一条，都在方案阶段逐项确认口径；不把「应该没问题」写成承诺。</p><div class=\"cards\" style=\"margin-top:4px\"><div class=\"card\"><div class=\"ct\">权限与审计</div><div class=\"cd\">资源授权与审计已在本版本实现；跨组织引用默认拒绝，组织级能力随企业版推进。</div></div><div class=\"card\"><div class=\"ct\">运行隔离</div><div class=\"cd\">命令与写入受官方沙箱与审批约束，实际操作仍需服务端检查，不以界面隐藏代替鉴权。</div></div><div class=\"card\"><div class=\"ct\">数据边界</div><div class=\"cd\">是否出网由所选模型与连接器决定，逐项在方案中列明。</div></div></div>"},{"type":"content","id":"trust-2","title":"信任与安全 · 版本与在建范围","label":"信任与安全 · 版本与在建范围","theme":"07 · 信任与安全","body":"<div class=\"cards\"><div class=\"card\"><div class=\"ct\">版本与发布</div><div class=\"cd\">已发布对象按修订演进，不原地改写历史；卸载默认保留用户数据。</div></div><div class=\"card tint\"><div class=\"ct\">在建范围</div><div class=\"cd\">项目空间、定时自动化、专家团 SOP、企业后台与企业 SSO 仍在推进；部门岗位与能力边界已定义，逐域的强制生效随身份打通同步覆盖。</div></div></div><div class=\"callout\" style=\"margin-top:11px\">已实现的能力与在建的能力在本手册中分别标注：<span class=\"pill\">已在本版本运行</span> 与 <span class=\"pill warn\">在扩展中</span>，便于你在方案阶段核对范围。</div>"},{"type":"content","id":"faq-1","title":"常见问题（一）","label":"常见问题（一）","theme":"08 · 常见问题","body":"<div class=\"cards\"><div class=\"card\"><div class=\"ct\">可以只用我们内网的模型吗？</div><div class=\"cd\">模型经官方适配器接入，凭据由企业侧提供。具体可用范围取决于所选模型服务与部署形态，我们在方案阶段确认。</div></div><div class=\"card\"><div class=\"ct\">能对接我们已有的 OA、CRM 或数据库吗？</div><div class=\"cd\">连接器以 MCP 接入外部系统，已具备多实例接入与工具发现能力，并已实测对接第三方文档服务。具体系统的接入方式与账号方案在联调阶段确定。</div></div><div class=\"card\"><div class=\"ct\">和直接使用对话式 AI 工具有什么区别？</div><div class=\"cd\">区别在于执行与交付：它自主规划并调用工具完成任务，产出的是可交付文件，过程与结果可留痕、可审批，而不是一段需要你自己复制的回答。</div></div></div>"},{"type":"content","id":"faq-2","title":"常见问题（二）","label":"常见问题（二）","theme":"08 · 常见问题","body":"<div class=\"cards\"><div class=\"card\"><div class=\"ct\">现在哪些能力可以直接用？</div><div class=\"cd\">技能资产、连接器、资料库、办公文档产出与单专家绑定已在本版本运行；项目空间、定时自动化、专家团 SOP、企业后台与企业 SSO 仍在建设中。</div></div><div class=\"card\"><div class=\"ct\">不同部门看到的东西一样吗？</div><div class=\"cd\">不一样。系统按部门口径定义了岗位与能力边界，运营、管理、生产、服务、销售、市场推广与应用各自看到对应的任务面、资料面与管理面。</div></div><div class=\"card tint\"><div class=\"ct\">还有问题？</div><div class=\"cd\">把场景、参与角色与数据边界告诉我们，一次性给出部署形态建议与 POC 方案。</div></div></div><div class=\"contact\" style=\"margin-top:12px\"><div class=\"cl\"><b>199 2529 9929</b><span>商务与合作 · 从一次场景沟通开始</span></div></div>"},{"type":"content","id":"coop-intro","title":"合作与签约 · 说明","label":"合作与签约 · 说明","theme":"09 · 合作与签约","body":"<h3>从一次场景沟通开始</h3><p class=\"lead\">告诉我们你的业务场景、参与角色与数据边界，我们会给出部署形态建议与一份可执行的 POC 方案。</p><div class=\"cards\" style=\"margin-top:8px\"><div class=\"card\"><div class=\"ct\">按需定制</div><div class=\"cd\">不堆砌功能，只解决客户真实业务里的问题。</div></div><div class=\"card\"><div class=\"ct\">联署共建</div><div class=\"cd\">方案由双方共同确认后落地，每一项能力上线前都经过客户验证。</div></div><div class=\"card\"><div class=\"ct\">持续陪伴</div><div class=\"cd\">环境搭好只是起点，后续的迭代、排障与优化由同一支 10 人的自有技术团队跟进，客户随时找得到人。</div></div></div>"},{"type":"content","id":"service","title":"我们提供的服务范围","label":"我们提供的服务范围","theme":"09 · 合作与签约","body":"<h3>我们提供的服务范围</h3><div class=\"deflist\" style=\"margin-top:var(--s2)\"><div class=\"def\"><div class=\"dt\">智能体定制</div><div class=\"dd\">按业务场景定义专家、技能与工具组合，交付可实际运行的智能体应用。</div></div><div class=\"def\"><div class=\"dt\">技能安装与调优</div><div class=\"dd\">安装与导入技能资产，并按真实使用反馈持续打磨产出质量。</div></div><div class=\"def\"><div class=\"dt\">工作台搭建</div><div class=\"dd\">搭建业务工作台与业务页面，联接内部系统，并配置权限与审计。</div></div><div class=\"def\"><div class=\"dt\">日常运维与迭代</div><div class=\"dd\">上线后的排障、优化与版本迭代由同一支团队负责，保留完整修订记录。</div></div></div><div class=\"contact\" style=\"margin-top:14px\"><div class=\"cl\"><b>199 2529 9929</b><span>商务与合作 · 也可以直接致电</span></div><div class=\"cqr\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\" shape-rendering=\"crispEdges\" role=\"img\" aria-label=\"扫码访问 WorkDSH 门户\"><rect width=\"200\" height=\"200\" fill=\"#ffffff\"/><path d=\"M0 0h8v8h-8zM8 0h8v8h-8zM16 0h8v8h-8zM24 0h8v8h-8zM32 0h8 <script>
/* 启动：数据源无关 —— 内联数据（静态单文件）或从 /api/portal/handbook/state 取（后台驱动）。 */
function bootReader(pages, cfg){
  PAGES = Array.isArray(pages) ? pages : [];
  N = PAGES.length;
  if(cfg && cfg.mediaBase) MEDIA_BASE = cfg.mediaBase;
  var tot = document.getElementById('totNo');
  if(tot) tot.textContent = N;
  var bootPage = pageFromHash();
  layout();
  var h = document.getElementById('hint');
  if(bootPage > 0) doJump(leafForPage(Math.max(0, Math.min(bootPage - 1, N - 1))));
  if(h){ setTimeout(function(){ h.style.opacity = '0'; }, 6500); }
}

onReady();
(function(){
  var cfg = window.__BOOK__ || {};
  if(typeof window.__PAGES__ !== 'undefined' && window.__PAGES__){
    bootReader(window.__PAGES__, cfg);
    return;
  }
  var url = '/api/portal/handbook/state' + (cfg.bookId ? ('?book=' + encodeURIComponent(cfg.bookId)) : '');
  var hint = document.getElementById('hint');
  if(hint) hint.textContent = '正在载入…';
  fetch(url, { credentials:'same-origin', cache:'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(doc){
      if(!doc || doc.ok === false) throw new Error((doc && doc.error) || 'load-failed');
      var meta = doc.meta || {};
      var b = document.querySelector('.brand .tt');
      if(b && meta.title){ b.innerHTML = esc(meta.title) + (meta.subtitle ? '<small>'+esc(meta.subtitle)+'</small>' : ''); }
      if(meta.title) document.title = meta.title + ' · 在线翻页电子书刊';
      bootReader(doc.pages, { mediaBase: doc.mediaBase });
      if(hint) hint.textContent = '点击页面右侧翻页 ｜ ← → 键翻页 ｜ 滚轮 / 左右滑动也可以';
    })
    .catch(function(err){
      if(hint) hint.textContent = '内容载入失败：' + (err && err.message ? err.message : '未知错误');
    });
})();
</script>
