<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070a10">
<title>登录 — WorkDSH 企业级 AI 智能体工作台</title>

<meta name="robots" content="noindex">
<link rel="icon" href="/portal/assets/mark.svg" type="image/svg+xml">

</head>
<body class="auth-body">

          <ellipse cx="66" cy="50" rx="22" ry="17.5" fill="#FFFFFF"/>

      </a>
      <p class="eyebrow">企业级 AI 智能体工作台</p>
      <h1>把任务交给能交付成果的智能体。</h1>
      <p class="lead">登录后进入工作台：对话式执行、真实文件产出、过程可审计。可私有化部署在企业内网，可按业务定制智能体与技能。</p>
      <ul class="ticks ticks-labeled">
        <li><strong>可私有化</strong>应用与数据可部署在企业自己的服务器或私有云。</li>
        <li><strong>可审计</strong>执行过程留痕，命令与写入按策略审批。</li>
        <li><strong>可定制</strong>按业务定制专家、技能与连接器，并保留版本与修订。</li>
      </ul>
      <p class="auth-foot">忘记密码请联系管理员重置。本站不提供自助找回。</p>
    </div>
  </section>

  <section class="auth-panel">
    <div class="auth-card">
      <h2>登录</h2>
      <p class="auth-sub">使用管理员分配的账号进入工作台。</p>
      {{ERROR}}
      <form class="auth-form" method="post" action="/api/portal/login" autocomplete="on">
        <input type="hidden" name="next" value="{{NEXT}}">
        <div class="field">
          <label for="username">用户名</label>
          <input id="username" name="username" type="text" autocomplete="username" required autofocus spellcheck="false">
        </div>
        <div class="field">
          <label for="password">密码</label>
          <div class="field-row">
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button class="reveal" type="button" data-portal-reveal aria-label="显示密码" aria-pressed="false">显示</button>
          </div>
        </div>
        <button class="button button-primary button-block" type="submit">登录</button>
      </form>
      <p class="auth-hint">账号由管理员统一分配，当前不支持企业微信、钉钉或 SSO 登录。</p>
      <p class="auth-back"><a href="/portal">返回产品介绍</a></p>
    </div>
  </section>
</main>

<script src="/portal/portal.js" defer></script>
</body>
</html>
