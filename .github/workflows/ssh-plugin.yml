name: SSH plugin test package
on:
  workflow_dispatch:
  push:
    paths: ['dsh-plugin-ssh/**', '.github/workflows/ssh-plugin.yml', 'yarn.lock']
jobs:
  plugin:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack yarn install --immutable
      - run: corepack yarn ssh:check
      - run: corepack yarn ssh:pack
      - run: npm install --prefix .test-harness --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@0.1.2-rc.1
      - run: node dsh-plugin-ssh/scripts/smoke-install.mjs .test-harness/node_modules/@deepseek-ai/dsh/lib/bin.js dist/dsh-plugin-ssh-v0.1.0.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-ssh-plugin-${{ matrix.os }}
          path: dist/dsh-plugin-ssh-v0.1.0.tgz
